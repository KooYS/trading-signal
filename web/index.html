<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<style>:root{color-scheme:light dark}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>구영서의 AI 매매 신호기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --sunk:#F0F2F5; --line:#E3E7EC; --line-soft:#EDF0F4;
  --ink:#14171C; --ink-2:#3D444F; --muted:#697586;
  --buy:#D42D2D; --buy-bg:#FDEDED; --sell:#1263C4; --sell-bg:#EAF2FC;
  --news:#966C18; --news-bg:#FBF3E2; --warn:#B4341C; --warn-bg:#FCEEEB;
  --bar:#3D444F;
  --shadow:0 1px 2px rgba(20,23,28,.05), 0 6px 16px -10px rgba(20,23,28,.18);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0F1216; --surface:#171B21; --sunk:#12161B; --line:#262C35; --line-soft:#1F252D;
  --ink:#E6E9ED; --ink-2:#B7BEC9; --muted:#838C9A;
  --buy:#FF7070; --buy-bg:#2A1618; --sell:#5FA6F2; --sell-bg:#111F30;
  --news:#D6AC63; --news-bg:#241D10; --warn:#F08163; --warn-bg:#2B1712;
  --bar:#8A93A0;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 20px -12px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --bg:#0F1216; --surface:#171B21; --sunk:#12161B; --line:#262C35; --line-soft:#1F252D;
  --ink:#E6E9ED; --ink-2:#B7BEC9; --muted:#838C9A;
  --buy:#FF7070; --buy-bg:#2A1618; --sell:#5FA6F2; --sell-bg:#111F30;
  --news:#D6AC63; --news-bg:#241D10; --warn:#F08163; --warn-bg:#2B1712;
  --bar:#8A93A0;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 20px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  line-height:1.55;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1340px;margin:0 auto;padding:0 20px 72px}

.top{border-bottom:1px solid var(--line);background:var(--surface)}
.top-in{max-width:1340px;margin:0 auto;padding:24px 20px 20px}
h1{margin:0 0 4px;font-size:19px;font-weight:600;letter-spacing:-.01em}
.sub{margin:0 0 18px;color:var(--muted);font-size:13px;font-weight:300}
.who{margin-left:6px;padding-left:9px;border-left:1px solid var(--line);font-size:12px}
.scoreboard{display:flex;flex-wrap:wrap;gap:10px}
.metric{flex:1 1 148px;min-width:148px;background:var(--sunk);border:1px solid var(--line-soft);
  border-radius:3px;padding:10px 12px}
.metric.flag{border-color:var(--news);background:var(--news-bg)}
.metric dt{margin:0 0 4px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}
.metric dd{margin:0;font-size:20px;font-weight:500;letter-spacing:-.02em}
.metric .note{display:block;margin-top:2px;font-size:11.5px;color:var(--muted);font-weight:300;letter-spacing:0}
.metric.flag dd{color:var(--news)}

.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding:10px 0;margin-bottom:18px}
.bar-in{max-width:1340px;margin:0 auto;padding:0 20px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.chip{font:inherit;font-size:12.5px;padding:5px 12px;border-radius:2px;cursor:pointer;
  background:var(--surface);color:var(--ink-2);border:1px solid var(--line)}
.chip:hover{border-color:var(--muted)}
.chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{margin-left:auto;font-size:12px;color:var(--muted)}
.live{margin-left:auto;font-size:11.5px;padding:2px 8px;border-radius:2px;color:var(--muted)}
.live:empty{display:none}
.live.wait{color:var(--muted);background:var(--sunk)}
.live.ok{color:var(--ink-2);background:var(--sunk)}
.live.warn{color:var(--warn);background:var(--warn-bg)}
.live + .count{margin-left:10px}
.chip .n{opacity:.55;font-size:11.5px;margin-left:1px}
.chip[aria-pressed="true"] .n{opacity:.75}

.lede{margin:0 0 16px;padding:11px 13px;background:var(--sunk);border:1px solid var(--line-soft);
  border-radius:3px;font-size:12.5px;color:var(--muted);font-weight:300;line-height:1.6;max-width:88ch}
.lede b{color:var(--ink-2);font-weight:500}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(455px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;
  box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.card-head{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--line-soft)}
.rank{font-size:11.5px;color:var(--muted);font-weight:500;min-width:20px}
.nm{font-size:15px;font-weight:500;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd{font-size:11.5px;color:var(--muted)}
.mkt{font-size:10px;font-weight:600;padding:1px 5px;border-radius:2px;flex:none;letter-spacing:.02em}
.mkt.kp{color:var(--sell);background:var(--sell-bg)}
.mkt.kq{color:var(--news);background:var(--news-bg)}
.nowbox{display:grid;gap:2px}
.priceline,.sigline{display:flex;align-items:baseline;gap:6px}
.now{font-size:19px;font-weight:500;letter-spacing:-.02em}
.sig{font-size:13px;font-weight:400;color:var(--ink-2)}
.plabel{font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.gap{font-size:11.5px;color:var(--muted);margin-left:auto}
.gap.up{color:var(--buy)} .gap.down{color:var(--sell)}
.tags{display:flex;flex-wrap:wrap;gap:5px;padding:10px 14px 11px}
.tag{font-size:10.5px;font-weight:500;padding:2px 7px;border-radius:2px;letter-spacing:.01em}
.tag.ok{color:var(--buy);background:var(--buy-bg);border:1px solid var(--buy-bg);font-weight:600}
.tag.bad{color:var(--sell);background:var(--sell-bg);border:1px solid var(--sell-bg);font-weight:600}
.tag.na{color:var(--muted);background:transparent;border:1px dashed var(--line)}
.tag.flow{color:var(--news);background:var(--news-bg);border:1px solid var(--news-bg)}
/* 검증에서 무효로 나온 것들. 검증된 배지(ok/bad)와 섞이지 않게 눌러둔다 */
.tag.info{color:var(--muted);background:transparent;border:1px solid var(--line-soft);font-weight:400}
.flag{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:2px}
.flag.B{color:var(--buy);background:var(--buy-bg)}
.flag.S{color:var(--sell);background:var(--sell-bg)}
.tm{margin-left:auto;font-size:12.5px;color:var(--muted);flex:none}

.body{display:grid;grid-template-columns:216px 1fr;height:352px}
.pane-l{padding:12px 14px;border-right:1px solid var(--line-soft);display:flex;flex-direction:column;gap:10px;overflow:hidden}
.pane-r{display:flex;flex-direction:column;min-height:0}

.score-row{display:flex;align-items:baseline;gap:7px}
.score-n{font-size:27px;font-weight:600;letter-spacing:-.03em;line-height:1}
.score-l{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}
.score-h{font-size:10px;color:var(--muted);font-weight:300;margin-left:auto}
.axes{display:grid;gap:4px}
.axis{display:grid;grid-template-columns:58px 1fr 46px;align-items:center;gap:6px;font-size:11px}
.axis span:first-child{color:var(--muted);font-weight:300;white-space:nowrap}
.track{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.fill{height:100%;background:var(--bar);border-radius:2px}
.axis .v{text-align:right;color:var(--ink-2);font-weight:500}
.fill.hot{background:var(--sell)}            /* 많이 오른 축 = 경고 = 파랑 */
.score-n.good{color:var(--buy)}              /* 과열도 낮음 = 좋다 = 빨강 */
.score-n.bad{color:var(--sell)}              /* 과열도 높음 = 나쁘다 = 파랑 */
.score-h.good{color:var(--buy)} .score-h.bad{color:var(--sell)}
.axis.na .fill{background:var(--line)}
.axis.na .v{color:var(--muted)}

/* ── 상세 모달 ── */
.card.clickable{cursor:pointer}
.card.clickable:hover{border-color:var(--muted)}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;
  display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:5px;
  width:min(1080px,100%);box-shadow:0 12px 40px -12px rgba(0,0,0,.5)}
.modal-head{display:flex;align-items:center;gap:9px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-t{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.modal-t .nm{font-size:17px;font-weight:600}
.modal-x{font:inherit;font-size:15px;line-height:1;background:none;border:0;color:var(--muted);
  cursor:pointer;padding:6px 8px;border-radius:2px}
.modal-x:hover{color:var(--ink);background:var(--sunk)}
.modal-x:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.modal-grid{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:20px;padding:16px 18px 20px}
.mcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.mprice{display:flex;flex-direction:column;gap:2px}
.mprice .now{font-size:24px;font-weight:500;letter-spacing:-.02em}
.msec-h{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  font-weight:500;margin-bottom:5px}
.modal-news{max-height:340px;overflow-y:auto}
@media (max-width:820px){ .modal-grid{grid-template-columns:1fr} }
.band{display:grid;gap:2px}
.band-lg{display:flex;gap:10px;margin:1px 0 3px;font-size:9.5px;color:var(--muted)}
.lgi{display:flex;align-items:center;gap:3px}
.sw{width:8px;height:8px;border-radius:1px;display:inline-block}
.sw.sup{background:var(--buy)} .sw.res{background:var(--sell)} .sw.cur{background:var(--muted)}
.band.big .brow{grid-template-columns:64px 1fr 40px;font-size:12px}
.band.big .btrack{height:12px}
.band.big .band-lg{font-size:11px}
.band-h{display:flex;align-items:center;gap:4px;font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:2px}
.brow{display:grid;grid-template-columns:44px 1fr 30px;align-items:center;gap:6px;font-size:10px;line-height:1.35}
.brow.here{font-weight:600}
.brow.here .blabel{color:var(--ink)}
.blabel{color:var(--muted);text-align:right}
.btrack{height:6px;background:var(--sunk);border-radius:1px;overflow:hidden}
.bfill{height:100%;border-radius:1px;min-width:1px}
.bfill.sup{background:var(--buy)}     /* 현재가 아래 = 지지 = 빨강(좋다) */
.bfill.res{background:var(--sell)}    /* 현재가 위 = 물린 물량 = 파랑 */
.bfill.cur{background:var(--muted)}   /* 현재가가 든 칸 = 절반이 아래라 중립 */
.brow.here .btrack{outline:1px solid var(--ink);outline-offset:1px}
.bpct{color:var(--muted);text-align:right}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 9px;font-size:12px}
.facts dt{color:var(--muted);font-weight:300}
.facts dd{margin:0;text-align:right;font-weight:500}
.facts dd.neg{color:var(--sell)}   /* 적자는 나쁨 = 파랑. 음수를 파랑으로 쓰는 관행과도 맞다 */
.ind{font-size:11px;color:var(--muted);font-weight:300;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}

.news-h{display:flex;align-items:center;gap:6px;padding:9px 14px 7px;flex:none;
  font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}
.dot{width:5px;height:5px;border-radius:50%;background:var(--news);flex:none}
.news-list{overflow-y:auto;padding:0 14px 12px;flex:1;min-height:0;scrollbar-width:thin}
.item{padding:7px 0;border-top:1px solid var(--line-soft)}
.item:first-child{border-top:0}
.item.post{opacity:.5}
.item-t{font-size:12.5px;line-height:1.45;color:var(--ink-2);text-decoration:none;display:block}
a.item-t:hover{color:var(--ink);text-decoration:underline}
a.item-t:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.item-m{margin-top:3px;font-size:11px;color:var(--muted);display:flex;gap:7px}
.split{display:flex;align-items:center;gap:8px;padding:9px 0 5px;font-size:10.5px;
  letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.split::after{content:"";flex:1;height:1px;background:var(--line)}
.empty{padding:14px;font-size:12.5px;color:var(--muted);font-weight:300}

/* 매도 — 신호만 받는 목록 */
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface);
  border:1px solid var(--line);border-radius:4px;overflow:hidden}
th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  font-weight:500;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--sunk)}
td{padding:7px 12px;border-bottom:1px solid var(--line-soft)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.up{color:var(--buy)} .down{color:var(--sell)}
.age{color:var(--muted);font-size:12px}
.scroller{overflow-x:auto}

/* 용어 설명. 물음표는 작고 흐리게 — 있는 줄은 알되 읽는 걸 방해하지 않게 */
.q{font:inherit;font-size:.8em;line-height:1;display:inline-flex;align-items:center;
  justify-content:center;width:1.35em;height:1.35em;padding:0;margin-left:3px;
  vertical-align:.11em;border:1px solid currentColor;border-radius:50%;
  background:none;color:var(--muted);opacity:.5;cursor:help}
.q:hover,.q[aria-expanded="true"]{opacity:1;color:var(--ink-2)}
.q:focus-visible{outline:2px solid var(--ink);outline-offset:1px;opacity:1}
#tip{position:fixed;z-index:50;max-width:320px;padding:10px 12px;border-radius:4px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
  font-size:12px;line-height:1.65;color:var(--ink-2);white-space:pre-wrap;font-weight:300}
#tip b{display:block;margin-bottom:4px;color:var(--ink);font-weight:600;font-size:12.5px}
#tip .verdict{display:inline-block;margin-top:6px;font-size:11px;padding:1px 6px;border-radius:2px}
#tip .verdict.ok{color:var(--buy);background:var(--buy-bg)}
#tip .verdict.no{color:var(--muted);background:var(--sunk)}
@media (max-width:680px){ #tip{max-width:calc(100vw - 28px)} }
.scroller > .empty{background:var(--surface);border:1px solid var(--line);border-radius:4px}

/* 관심 종목 별. 카드·표 어디서든 같은 모양 */
.star{font:inherit;font-size:13px;line-height:1;padding:1px 3px;border:0;background:none;
  cursor:pointer;color:var(--muted);opacity:.4;border-radius:2px}
.star:hover{opacity:.85}
.star.on{color:var(--news);opacity:1}
.star:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
th.s,td.s{width:24px;padding-left:10px;padding-right:0}
/* 종목 칸에 물려둔 코드·시장. 넓은 화면에서는 각자 칸이 있으므로 숨는다 */
.nm-code,.nm-mkt{display:none}
.nm-code{font-size:11.5px;color:var(--muted);font-weight:400}
.card-head .star{font-size:15px;margin-left:-3px}
.chip.fav[aria-pressed="true"]{background:var(--news);color:#fff;border-color:var(--news)}

/* 관심 종목이 팔렸다는 알림. 확인을 누를 때까지 남는다 */
.alert{margin:0 0 16px;padding:11px 13px;border:1px solid var(--news);background:var(--news-bg);
  border-radius:3px;font-size:12.5px;color:var(--ink-2);display:flex;gap:10px;align-items:flex-start}
.alert b{font-weight:600;color:var(--ink)}
.alert ul{margin:5px 0 0;padding-left:16px;line-height:1.75}
.alert .x{margin-left:auto;flex:none;font:inherit;font-size:16px;line-height:1;padding:0 4px;
  border:0;background:none;color:var(--muted);cursor:pointer}
.alert .x:hover{color:var(--ink)}

footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;
  color:var(--muted);font-weight:300;line-height:1.7;max-width:92ch}
/* ── 좁은 화면 ──────────────────────────────────────────────
   표가 10칸을 넘어서 가로 스크롤로는 못 읽는다. 한 줄을 카드로 접고
   칸 이름을 각 값 옆에 붙인다(td::before + data-label).          */
@media (max-width:680px){
  .wrap{padding:0 14px 56px}
  .top-in{padding:18px 14px 14px}
  .bar-in{padding:0 14px}
  h1{font-size:17px}
  .sub{margin-bottom:14px;font-size:12.5px}
  .who{display:block;margin:3px 0 0;padding:0;border-left:0}
  .metric{flex:1 1 calc(50% - 5px);min-width:0;padding:9px 10px}
  .metric dd{font-size:18px}

  /* 칩이 여섯이라 줄바꿈하면 화면을 다 먹는다. 칩만 가로로 흘리고
     갱신 시각·건수는 윗줄에 남긴다 */
  .bar-in{gap:5px 8px}
  .live{order:0;margin-left:0;flex:none}
  .count{order:1;margin-left:auto;flex:none}
  .chips{order:2;flex:0 0 100%;flex-wrap:nowrap;overflow-x:auto;gap:6px;
    scrollbar-width:none;padding-bottom:1px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none}

  .lede{font-size:12px;padding:10px 11px}
  .grid{grid-template-columns:1fr;gap:10px}
  .body{grid-template-columns:1fr;height:auto}
  .pane-l{border-right:0;border-bottom:1px solid var(--line-soft)}
  .news-list{max-height:190px}
  .card-head{padding:10px 12px;gap:7px}
  .rank{min-width:16px}
  .nm{font-size:14.5px}

  /* 표 → 카드 */
  .scroller{overflow-x:visible}
  table{display:block;border:0;background:none;border-radius:0;overflow:visible}
  thead{display:none}
  tbody{display:block}
  tr{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    gap:0 12px;padding:9px 12px;margin-bottom:8px;background:var(--surface);
    border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow)}
  td{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
    border:0;padding:2px 0;text-align:right;font-size:12.5px}
  td::before{content:attr(data-label);flex:none;color:var(--muted);font-weight:300;font-size:11px}
  /* 종목은 DOM 순서와 무관하게 카드 제목 줄로 올린다 */
  td.col-nm{order:-1;grid-column:1/-1;justify-content:flex-start;align-items:center;gap:6px;
    padding:0 30px 6px 0;margin-bottom:5px;font-size:14px;font-weight:500;
    border-bottom:1px solid var(--line-soft)}
  td.col-code,td.col-mkt{display:none}    /* 제목 줄로 올라갔다 */
  .nm-code,.nm-mkt{display:inline-block}
  td.s{position:absolute;top:5px;right:7px;width:auto;padding:0}
  .star{font-size:17px;padding:5px 7px}   /* 손가락으로 누를 크기 */

  .alert{padding:10px 11px}
  .alert ul{padding-left:15px}
  .alert .x{font-size:20px;padding:2px 6px;margin-top:-2px}

let tipFor = null, tipMode = null;   // hover 로 연 것을 click 이 토글로 닫으면 안 된다
function showTip(btn) {
  const g = GLOSS[btn.dataset.k];
  const tip = document.getElementById("tip");
  if (!g) return;
  tip.replaceChildren();
  tip.append(el("b", null, g[0]));
  tip.append(document.createTextNode(g[1]));
  if (g[2]) tip.append(el("span", "verdict " + g[2][1], g[2][0]));
  tip.hidden = false;
  btn.setAttribute("aria-expanded", "true");
  tipFor = btn;
  placeTip();
}
function placeTip() {
  if (!tipFor) return;
  const tip = document.getElementById("tip");
  const r = tipFor.getBoundingClientRect(), t = tip.getBoundingClientRect();
  // 화면 밖으로 나가지 않게 가둔다. 아래 자리가 부족하면 위로 띄운다
  tip.style.left = Math.max(8, Math.min(r.left - 8, innerWidth - t.width - 8)) + "px";
  tip.style.top = (r.bottom + 6 + t.height > innerHeight ? r.top - t.height - 6 : r.bottom + 6) + "px";
}
function hideTip() {
  document.getElementById("tip").hidden = true;
  if (tipFor) tipFor.setAttribute("aria-expanded", "false");
  tipFor = null; tipMode = null;
}
/* 물음표 하나. 데스크톱은 올리면, 모바일은 눌러야 뜬다 */
function q(key) {
  const b = el("button", "q", "?");
  b.type = "button"; b.dataset.k = key;
  b.setAttribute("aria-label", (GLOSS[key] || [key])[0] + " 설명");
  b.setAttribute("aria-expanded", "false");
  return b;
}
document.addEventListener("click", e => {
  const b = e.target.closest(".q");
  if (!b) return hideTip();
  e.stopPropagation();
  // 터치와 호버를 다 지원하는 기기(터치 노트북 등)에서는 탭 한 번에
  // mouseover 로 열리고 click 이 곧바로 닫아버린다. 그래서 호버로 열린 건 닫지 않는다.
  if (b === tipFor && tipMode === "click") return hideTip();
  showTip(b); tipMode = "click";
});
if (matchMedia("(hover:hover)").matches) {
  document.addEventListener("mouseover", e => {
    const b = e.target.closest(".q");
    if (b && b !== tipFor) { showTip(b); tipMode = "hover"; }
  });
  document.addEventListener("mouseout", e => {
    if (tipMode === "hover" && e.target.closest(".q")
        && !e.relatedTarget?.closest("#tip")) hideTip();
  });
}
document.addEventListener("keydown", e => { if (e.key === "Escape") hideTip(); });
/* 스크롤에 닫지 않고 따라 움직인다. 버튼을 누르면 브라우저가 포커스를 주며
   스크롤을 일으키는데, 거기서 닫아버리면 모바일에서 툴팁이 열리자마자 사라진다. */
addEventListener("scroll", () => {
  if (!tipFor) return;
  const r = tipFor.getBoundingClientRect();
  if (r.bottom < 0 || r.top > innerHeight) return hideTip();   // 기준점이 화면 밖이면 닫는다
  placeTip();
}, true);
addEventListener("resize", hideTip);

/* ── 관심 종목 ───────────────────────────────────────────────
   이 브라우저의 localStorage 에만 있다. 서버에 사용자 개념이 없어서
   폰과 PC 가 따로 논다. 공유하려면 테이블이 하나 더 필요하다.      */
const FAV_KEY = "fav.codes", SEEN_KEY = "fav.seen";
const store = {
  get(k, dflt) { try { return JSON.parse(localStorage.getItem(k)) ?? dflt; } catch { return dflt; } },
  set(k, v)    { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* 시크릿 창 */ } },
};
const FAV = new Set(store.get(FAV_KEY, []));
let favOnly = false;
const key = c => c.code + ":" + (c.sd || "");
const pick = rows => favOnly ? rows.filter(r => FAV.has(r.code)) : rows;

function toggleFav(code) {
  FAV.has(code) ? FAV.delete(code) : FAV.add(code);
  store.set(FAV_KEY, [...FAV]);
  syncCounts(); renderAlert(); render();
}
function star(code) {
  const on = FAV.has(code);
  const b = el("button", "star" + (on ? " on" : ""), on ? "★" : "☆");
  b.type = "button";
  b.title = on ? "관심 해제" : "관심 등록";
  b.setAttribute("aria-pressed", String(on));
  b.addEventListener("click", () => toggleFav(code));
  return b;
}

/* 과열도의 세 요소. 셋 다 "그날 후보 중 위쪽이면 손해"로 나온 것들이다.
   0~100 백분위로 눕혀서 보여준다 — 원값은 단위가 제각각이라 비교가 안 된다 */
const HEAT_PARTS = [
  ["pos", "20일 밴드", v => v == null ? null : v, v => v + "%"],
  ["ma20", "20일선 이격", v => v == null ? null : Math.max(0, Math.min(100, (v + 20) * 2.5)), v => pct(v)],
  ["vwap", "매물대 대비", v => v == null ? null : Math.max(0, Math.min(100, (v + 30) * 1.67)), v => pct(v)],
];

function buyCard(c, rank) {
  const pre = c.news.filter(n => n.pre), post = c.news.filter(n => !n.pre);
  const wrap = el("article", "card");

  const head = el("div", "card-head");
  head.append(el("span", "rank mono", "#" + rank));
  head.append(star(c.code));
  head.append(el("span", "nm", c.name));
  head.append(el("span", "cd mono", c.code));
  if (c.mkt) head.append(el("span", "mkt " + (c.mkt === "코스피" ? "kp" : "kq"), c.mkt));
  head.append(el("span", "tm mono", c.time));
  wrap.append(head);

  const tags = el("div", "tags");
  for (const [t, kind, key] of badges(c)) {
    const sp = el("span", "tag " + kind, t);
    if (key) sp.append(q(key));
    tags.append(sp);
  }
  wrap.append(tags);

  const body = el("div", "body");
  const L = el("div", "pane-l");

  /* 색만으로는 방향을 못 읽는다. 판정을 말로도 적는다.
     빨강=좋다 / 파랑=나쁘다 — 실현수익률(+빨강 -파랑)과 같은 방향이다 */
  const sr = el("div", "score-row");
  const h = c.heat;
  const kind = h == null ? "" : h >= 70 ? "bad" : h <= 30 ? "good" : "";
  const word = h == null ? "지표 없음" : h >= 70 ? "과열" : h <= 30 ? "양호" : "보통";
  sr.append(el("span", "score-n mono " + kind, h == null ? "—" : h));
  const lab = el("span", "score-l", "과열도");
  lab.append(q("heat"));
  sr.append(lab);
  sr.append(el("span", "score-h " + kind, word));
  L.append(sr);

  const now = el("div", "nowbox");
  const line = el("div", "priceline");
  line.append(el("span", "now mono", c.now ? c.now.toLocaleString() + "원" : "—"));
  line.append(el("span", "plabel", "현재가"));
  now.append(line);
  const sig = el("div", "sigline");
  sig.append(el("span", "plabel", "신호가"));
  sig.append(el("span", "sig mono", c.price ? c.price.toLocaleString() + "원" : "—"));
  if (c.gap != null) {
    const g = Number(c.gap);
    sig.append(el("span", "gap mono " + (g > 0 ? "up" : g < 0 ? "down" : ""), pct(g)));
  }
  now.append(sig);
  L.append(now);

  const ax = el("div", "axes");
  for (const [k, label, toPct, fmt] of HEAT_PARTS) {
    const raw = c.hp ? c.hp[k] : null, w = toPct(raw);
    const row = el("div", "axis" + (raw == null ? " na" : ""));
    const lb = el("span", null, label);
    lb.append(q(k === "pos" ? "pos" : k === "ma20" ? "ma20" : "vwap"));
    row.append(lb);
    const t = el("div", "track");
    const f = el("div", "fill" + (w != null && w >= 70 ? " hot" : ""));   // 70%↑ = 파랑 경고
    f.style.width = (w == null ? 50 : w) + "%";
    t.append(f); row.append(t);
    row.append(el("span", "v mono", raw == null ? "—" : fmt(raw)));
    ax.append(row);
  }
  L.append(ax);

  const dl = el("dl", "facts");
  const facts = [
    ["시총", eok(c.cap), false, "cap"],
    ["PBR", c.pbr == null ? "—" : Number(c.pbr).toFixed(1), false, "pbr"],
    ["ROE", c.roe == null ? "—" : Number(c.roe).toFixed(1) + "%", c.roe < 0, "roe"],
    ["52주 위치", c.p52 == null ? "—" : c.p52 + "%", false, "p52"],
    ["외국인 보유", c.frate == null ? "—" : Number(c.frate).toFixed(1) + "%", false, "frate"],
  ];
  for (const [k, v, neg, key] of facts) {
    const dt = el("dt", null, k);
    dt.append(q(key));
    dl.append(dt);
    dl.append(el("dd", "mono" + (neg ? " neg" : ""), v));
  }
  L.append(dl);
  if (c.ind) L.append(el("div", "ind", c.ind));
  body.append(L);

  const R = el("div", "pane-r");
  const nh = el("div", "news-h");
  if (pre.length) nh.append(el("span", "dot"));
  nh.append(el("span", null, pre.length ? `신호 전 뉴스 ${pre.length}건` : "신호 전 뉴스 없음"));
  nh.append(q("news"));
  R.append(nh);
  const list = el("div", "news-list");
  if (!c.news.length) list.append(el("p", "empty", "최근 7일 내 관련 기사가 없다. 근거를 알 수 없는 신호."));
  else {
    for (const n of pre) list.append(newsItem(n, false));
    if (post.length) {
      list.append(el("div", "split", "신호 이후"));
      for (const n of post) list.append(newsItem(n, true));
    }
  }
  R.append(list);
  body.append(R);
  wrap.append(body);
  wrap.classList.add("clickable");
  wrap.addEventListener("click", e => {
    if (e.target.closest("a, button, .q")) return;   // 링크·★·툴팁은 그대로
    openDetail(c);
  });
  return wrap;
}

   어디가 뚫리면 아래가 비는지 보려는 것. 검증에서 t가 안 나와 점수엔 안 넣는다. */
function bandChart(c, big) {
  const tot = c.band.reduce((a, z) => a + (z.f || 0) + (z.i || 0), 0);
  if (!tot) return el("div");
  const wrap = el("div", "band" + (big ? " big" : ""));
  const h = el("div", "band-h");
  h.append(el("span", null, "외국인·기관 매집"
    + (c.bandDays ? ` ${c.bandDays}일` : "")));
  h.append(q("band"));
  wrap.append(h);
  /* 색이 매수/매도로 읽히는 오해가 있어 범례를 박는다.
     막대는 전부 '순매수'다 — 순매도한 날은 애초에 안 들어간다. */
  const lg = el("div", "band-lg");
  const mk = (cls, txt) => {
    const w = el("span", "lgi");
    w.append(el("i", "sw " + cls));
    w.append(document.createTextNode(txt));
    return w;
  };
  lg.append(mk("sup", "싸게 매집 · 지지"));
  lg.append(mk("cur", "현재가 구간"));
  lg.append(mk("res", "비싸게 매집 · 저항"));
  wrap.append(lg);
  const max = Math.max(...c.band.map(z => (z.f || 0) + (z.i || 0)));
  for (const z of c.band) {
    const sum = (z.f || 0) + (z.i || 0);
    const here = c.now != null && c.now >= z.lo && c.now <= z.hi;
    // 현재가가 든 칸은 절반이 아래라 지지·저항 어느 쪽도 아니다. 따로 표시한다.
    const below = c.now != null && !here && z.hi <= c.now;
    const row = el("div", "brow" + (here ? " here" : ""));
    row.append(el("span", "blabel mono", Math.round(z.lo).toLocaleString()));
    const track = el("div", "btrack");
    const fill = el("div", "bfill " + (here ? "cur" : below ? "sup" : "res"));
    fill.style.width = (max ? (sum / max) * 100 : 0) + "%";
    track.append(fill);
    row.append(track);
    row.append(el("span", "bpct mono", Math.round(100 * sum / tot) + "%"));
    wrap.append(row);
  }
  return wrap;
}

/* ── 상세 ────────────────────────────────────────────────────
   카드는 훑고 비교하는 화면이라 가볍게 두고, 정독할 것은 여기로 모은다. */
function openDetail(c) {
  const back = el("div", "modal-back");
  const box = el("div", "modal");

  const head = el("div", "modal-head");
  const t = el("div", "modal-t");
  t.append(el("span", "nm", c.name));
  t.append(el("span", "cd mono", c.code));
  if (c.mkt) t.append(el("span", "mkt " + (c.mkt === "코스피" ? "kp" : "kq"), c.mkt));
  head.append(t);
  const x = el("button", "modal-x", "✕");
  x.setAttribute("aria-label", "닫기");
  head.append(x);
  box.append(head);

  const grid = el("div", "modal-grid");

  /* 왼쪽 — 가격과 판정 */
  const a = el("div", "mcol");

  pr.append(el("span", "now mono", c.now ? c.now.toLocaleString() + "원" : "—"));
  if (c.gap != null) {
    const g = Number(c.gap);
    pr.append(el("span", "gap mono " + (g > 0 ? "up" : g < 0 ? "down" : ""),
      "신호가 " + (c.price ? c.price.toLocaleString() : "—") + " · " + pct(g)));
  }
  a.append(pr);
  const tg = el("div", "tags");
  for (const [txt, kind, key] of badges(c)) {
    const b = el("span", "tag " + kind, txt);
    if (key) b.append(q(key));
    tg.append(b);
  }
  a.append(tg);
  a.append(mSection("지표", [
    ["과열도", c.heat == null ? "—" : c.heat],
    ["20일 밴드", c.hp && c.hp.pos != null ? c.hp.pos + "%" : "—"],
    ["20일선 이격", c.hp && c.hp.ma20 != null ? Number(c.hp.ma20).toFixed(2) + "%" : "—"],
    ["매물대 대비", c.hp && c.hp.vwap != null ? Number(c.hp.vwap).toFixed(2) + "%" : "—"],
    ["5일 수익률", c.ret5 == null ? "—" : pct(c.ret5)],
    ["20일 수익률", c.ret20 == null ? "—" : pct(c.ret20)],
    ["거래량 배수", c.vol == null ? "—" : Number(c.vol).toFixed(1) + "배"],
  ]));
  a.append(mSection("재무", [
    ["시총", eok(c.cap)],
    ["PBR", c.pbr == null ? "—" : Number(c.pbr).toFixed(1)],
    ["ROE", c.roe == null ? "—" : Number(c.roe).toFixed(1) + "%"],
    ["52주 위치", c.p52 == null ? "—" : c.p52 + "%"],
    ["업종", c.ind || "—"],
  ]));
  a.append(mSection("수급", [
    ["외국인 보유", c.frate == null ? "—" : Number(c.frate).toFixed(1) + "%"],
    ["외국인 연속", c.fgn ? c.fgn + "일 " + qty(c.fgn5) : "—"],
    ["기관 연속", c.ins ? c.ins + "일 " + qty(c.ins5) : "—"],
    ["국면", c.regime === "inst_only" ? "기관만 매도 " + c.isell + "일"
           : c.regime === "both" ? "외국인·기관 동시 매도"
           : c.regime === "fgn_only" ? "외국인만 매도 " + c.fsell + "일" : "—"],
    ["기준일", c.fasof || "—"],
  ]));
  grid.append(a);

  /* 가운데 — 매집 분포 */
  const b2 = el("div", "mcol");
  if (c.band && c.band.length) b2.append(bandChart(c, true));
  else b2.append(el("p", "empty", "매집 분포를 계산할 수 없다."));
  grid.append(b2);

  /* 오른쪽 — 공시·뉴스 */
  const c3 = el("div", "mcol");
  const dl = (c.disc || []);
  const dh = el("div", "msec-h");
  dh.append(el("span", null, "공시 (신호 전 7일)"));
  c3.append(dh);
  if (!dl.length) c3.append(el("p", "empty", "해당 기간 공시 없음."));
  else for (const d of dl) {
    const row = el("div", "item");
    row.append(el("span", "item-t", d.t));
    row.append(el("div", "item-m").appendChild(el("span", "mono", d.d || "")).parentNode);
    c3.append(row);

  const nh = el("div", "msec-h");
  nh.append(el("span", null, `뉴스 ${(c.news || []).length}건`));
  c3.append(nh);
  const nl = el("div", "modal-news");
  if (!(c.news || []).length) nl.append(el("p", "empty", "최근 7일 내 관련 기사 없음."));
  else for (const n of c.news) nl.append(newsItem(n, !n.pre));
  c3.append(nl);
  grid.append(c3);

  box.append(grid);
  back.append(box);
  document.body.append(back);

  const close = () => { back.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  x.addEventListener("click", close);
  back.addEventListener("click", e => { if (e.target === back) close(); });
  document.addEventListener("keydown", onKey);
  x.focus();
}

function mSection(title, rows) {
  const w = el("div");

function newsItem(n, after) {

/* 표 머리. [제목, 우측정렬] */
function tableHead(t, cols) {
  const hr = el("tr");
  hr.append(el("th", "s", ""));                       // 별 칸
  for (const [h, r] of cols) hr.append(el("th", r ? "r" : null, h));
  const thead = el("thead"); thead.append(hr); t.append(thead);
  return el("tbody");
}
const won = v => v ? Number(v).toLocaleString() : "—";
const starCell = code => { const n = el("td", "s"); n.append(star(code)); return n; };

/* 좁은 화면에서 표는 한 줄이 카드 하나로 접힌다. 그때 data-label 이 이름표가 된다 */
function td(label, cls, text) {
  const n = el("td", cls, text);
  if (label) n.dataset.label = label;
  return n;
}
/* 종목 칸. 접히면 카드 제목 줄이 되므로 코드·시장을 함께 물고 간다
   (넓은 화면에서는 그 둘이 각자 칸을 갖고, 여기 붙은 건 숨는다) */
function nameCell(o) {
  const n = el("td", "col-nm");
  n.append(el("span", null, o.name));
  n.append(el("span", "nm-code mono", o.code));
  if (o.mkt) n.append(el("span", "nm-mkt mkt " + (o.mkt === "코스피" ? "kp" : "kq"), o.mkt));
  return n;
}
/* 수익률 칸. 부호에 따라 색이 붙는다 */
function pctCell(label, v) {
  const n = v == null ? null : Number(v);
  return td(label, "r mono " + (n > 0 ? "up" : n < 0 ? "down" : ""), n == null ? "—" : pct(n));
}

];

/* 점수의 근거를 문장 대신 태그로. 카드를 보면 왜 위에 있는지 읽힌다 */
/* 배지는 두 종류다.
   ok/bad = 6,369 라운드에서 검증된 것. 그 외는 전부 info — 무효로 확인됐지만
   판단에 참고가 되니 남긴다. 색으로 구분해서 검증된 것처럼 보이지 않게 한다. */
/* [문구, 색, 용어키]. 색은 ok/bad 만 검증된 것이고 info 는 참고용이다 */
function badges(c) {
  const out = [];
  if (c.ir) out.push(["IR 공시 " + String(c.ir).slice(5), "ok", "ir"]);
  if (c.heat != null && c.heat >= 70) out.push(["과열 상위 " + c.heat, "bad", "hot"]);
  if (c.heat != null && c.heat <= 30) out.push(["눌림 하위 " + c.heat, "ok", "cool"]);
  for (const d of (c.disc || []).slice(0, 2))
    out.push([String(d.t).replace(/^\[[^\]]*\]/, "").trim().slice(0, 18), "info", "disc"]);
  if (c.fgn >= 3) out.push(["외국인 " + c.fgn + "일 " + qty(c.fgn5), "info", "flow"]);
  if (c.ins >= 3) out.push(["기관 " + c.ins + "일 " + qty(c.ins5), "info", "flow"]);
  /* 수급 국면 — 검정에서 순서가 두 표본에 걸쳐 일치한 유일한 수급 지표. 아직 참고용 */
  if (c.regime === "inst_only") out.push(["기관만 매도 " + c.isell + "일", "info", "regime"]);
  if (c.regime === "both") out.push(["외국인·기관 동시 매도", "info", "regime"]);
  if (c.vol != null && c.vol >= 2) out.push(["거래량 " + Number(c.vol).toFixed(1) + "배", "info", "vol"]);
  if (c.loss) out.push(["적자", "info", "loss"]);
  if (c.pbr != null && c.pbr < 1) out.push(["PBR " + Number(c.pbr).toFixed(1), "info", "pbr"]);
  if (c.gap != null && c.gap > 3) out.push(["진입 늦음 " + pct(c.gap), "info", "gap"]);
  if (c.heat == null) out.push(["지표 없음", "na"]);
  return out;
}

let filter = "buy";
function render() {
  const grid = document.getElementById("grid"), table = document.getElementById("table");
  const lede = document.getElementById("lede");
  lede.replaceChildren(el("b", null, HINT[filter]));

  const n = TABS.find(t => t[0] === filter)[2]();
  if (!n) {                                   // 빈 격자 대신 이유를 적는다
    grid.hidden = true; table.hidden = false;
    table.replaceChildren(el("p", "empty", favOnly
      ? "관심 종목 중에는 해당하는 게 없다. ★ 관심만 을 끄면 전체가 보인다."
      : EMPTY[filter]));
    cnt.textContent = "0건";
    return;
  }

  if (filter === "buy") {
    grid.hidden = false; table.hidden = true;
    grid.replaceChildren(...pick(BUYS).map((c, i) => buyCard(c, i + 1)));
    lede.append(document.createTextNode(
      " 과열도는 절대 기준이 아니라 그날 후보들 사이의 상대 순위(0~100)다."
      + " 색은 양봉·음봉과 같은 방향이다 — 빨강이 좋고 파랑이 나쁘다. 회색 배지는 검증에서 무효로 나온 정보성 항목이다."
      + (FLOW_ASOF ? ` 수급은 ${FLOW_ASOF} 기준이고 당일치는 20시경 확정된다.` : "")
      + " ★ 를 눌러두면 진행중·청산까지 따라다니고, 팔리면 맨 위에 알림이 뜬다."));
    cnt.textContent = `${n}건 · 과열도 낮은 순`;
    return;
  }
  grid.hidden = true; table.hidden = false;
  table.replaceChildren(filter === "sell"   ? sellTable()
                      : filter === "open"   ? openTable()
                      : filter === "closed" ? closedTable() : allTable());
  cnt.textContent = filter === "sell"   ? `${n}건`
                  : filter === "open"   ? `${n}종목 보유중`
                  : filter === "closed" ? `${n}라운드 · 최근 30일`
                  : `${n}건 · 최근 순`;
}

/* ── 관심 종목 매도 알림 ─────────────────────────────────────
   오늘 매도 탭은 하루면 사라진다. 놓치지 않게, 확인을 누를 때까지
   남긴다. 확인 표시도 이 브라우저에만 쌓인다.                  */
function renderAlert() {
  const box = document.getElementById("alert");
  const seen = new Set(store.get(SEEN_KEY, []));
  const fresh = CLOSED.filter(c => FAV.has(c.code) && !seen.has(key(c)));
  box.replaceChildren();
  if (!fresh.length) return;

  const d = el("div", "alert"), body = el("div");
  body.append(el("b", null, `관심 종목 ${fresh.length}건이 매도됐다`));
  const ul = el("ul");
  for (const c of fresh.slice(0, 8)) {
    const li = el("li");
    li.append(document.createTextNode(c.name + " "));
    const v = Number(c.profit);
    li.append(el("span", "mono " + (v > 0 ? "up" : v < 0 ? "down" : ""), pct(v)));
    li.append(el("span", "mono", ` ${won(c.bp)} → ${won(c.sp)}`));
    li.append(document.createTextNode(` · ${c.sd} · ${c.held}일 보유`));
    ul.append(li);
  }
  if (fresh.length > 8) ul.append(el("li", null, `외 ${fresh.length - 8}건`));
  body.append(ul);
  d.append(body);

  const x = el("button", "x", "×");
  x.type = "button"; x.title = "확인";
  x.addEventListener("click", () => {
    /* 30일 창을 벗어난 키는 같이 버린다 — 무한정 쌓이지 않게 */
    const live = new Set(CLOSED.map(key));
    store.set(SEEN_KEY, [...new Set([...seen, ...fresh.map(key)])].filter(k => live.has(k)));
    renderAlert();
  });
  d.append(x);
  box.append(d);
}

    tr.append(nameCell(o));
    tr.append(td("코드", "mono col-code", o.code));

/* 전체 탭: 매수·매도를 시각 순으로 한 줄씩 */
function allTable() {
  const rows = [
    ...pick(BUYS).map(b => ({ f: "B", name: b.name, code: b.code, mkt: b.mkt, time: b.time,
                        price: b.price, now: b.now, extra: b.heat == null ? "—" : "과열 " + b.heat })),
    ...pick(SELLS).map(s => ({ f: "S", name: s.name, code: s.code, mkt: s.mkt, time: s.time,

  ].sort((a, b) => b.time.localeCompare(a.time));

  const t = el("table");
  const tb = tableHead(t, [["구분", 0], ["종목", 0], ["코드", 0], ["시장", 0], ["시각", 0],
                           ["신호가", 1], ["현재가", 1], ["과열도 / 실현", 1]]);
  for (const r of rows) {
    const tr = el("tr");
    tr.append(starCell(r.code));
    const fl = td("구분", null);
    fl.append(el("span", "flag " + r.f, r.f === "B" ? "매수" : "매도"));
    tr.append(fl);
    tr.append(nameCell(r));
    tr.append(td("코드", "mono col-code", r.code));

/* ── 라이브 갱신 ─────────────────────────────────────────────
   아티팩트 CSP가 외부 fetch 를 막아서 Supabase 를 직접 못 부른다.
   대신 뷰어의 Supabase 커넥터를 통해 읽는다. 연결이 안 되면(다른 사람이
   열었거나 커넥터가 없거나) 발행 시점 스냅샷 그대로 보인다.            */
const PROJECT = "fvwwxhdufcqpcyysfdgg";
const QUERY = "select data from page_live";

function setStatus(kind, text) {
  const el0 = document.getElementById("live");
  el0.className = "live " + kind;
  el0.textContent = text;
}

/* execute_sql 은 안내문으로 감싼 텍스트를 준다. 그 안의 JSON 만 꺼낸다 */
function parseRows(payload) {
  if (payload && typeof payload === "object") return payload;
  if (typeof payload !== "string") return null;
  const m = payload.match(/<untrusted-data-[^>]*>\s*([\s\S]*?)\s*<\/untrusted-data-/);
  try { return JSON.parse(m ? m[1] : payload); } catch { return null; }
}

function applyLive(d) {
  if (!d || !Array.isArray(d.buys)) return false;
  D = d; BUYS = d.buys; SELLS = d.sells || []; OPEN = d.open || []; CLOSED = d.closed || [];
  FLOW_ASOF = (BUYS.find(b => b.fasof) || {}).fasof || null;
  DATA_DATE = d.date || null;
  if (d.stat) M = Object.assign({}, M, d.stat, {
    buy_news: BUYS.filter(c => c.news.some(n => n.pre)).length,
    buy_loss: BUYS.filter(c => c.loss).length });
  syncCounts();
  renderAlert();
  renderScore();
  render();
  return true;
}

const LIVE_MSG = {
  needs_reauth:        "Supabase 연결이 만료됐다. 커넥터를 다시 연결하면 최신 데이터가 뜬다.",
  server_not_connected:"Supabase 커넥터가 없다. 연결하면 매일 자동으로 갱신된다.",
  selection_required:  "Supabase 커넥터가 여러 개다. 하나를 고르면 갱신된다.",
  not_granted:         "데이터 접근이 허용되지 않았다.",
  blocked_by_policy:   "정책상 이 연결이 차단됐다.",
  approval_required:   "승인이 필요한 연결이다.",
};

/* 데이터 소스는 두 곳. 아티팩트에서는 뷰어의 Supabase 커넥터를 통하고(CSP가
   외부 fetch를 막는다), Vercel 에서는 서버리스 프록시를 부른다. 둘 다 없으면
   발행 시점 스냅샷 그대로 — 기능만 빠지고 화면은 산다. */
async function connectVercel() {
  const k = new URLSearchParams(location.search).get("k");
  const r = await fetch("/api/data" + (k ? "?k=" + encodeURIComponent(k) : ""));
  if (r.status === 401) { setStatus("warn", "접근이 거부됐다. 토큰이 설정된 배포다."); return true; }
  if (!r.ok) { setStatus("warn", "데이터를 못 가져왔다. 스냅샷을 보는 중."); return true; }
  if (!applyLive(await r.json())) { setStatus("warn", "데이터 형식을 읽지 못했다."); return true; }
  setStatus("ok", (DATA_DATE || "") + " 기준 · 방금 갱신");
  return true;
}

function connectArtifact(mcp) {
  let retried = false;
  mcp.watchTool("Supabase", "execute_sql",
    { project_id: PROJECT, query: QUERY },
    (ev) => {
      if (ev.type === "data") {
        const rows = parseRows(ev.result?.payload);
        const d = Array.isArray(rows) ? rows[0]?.data : rows?.data;
        if (!applyLive(d)) return setStatus("warn", "데이터 형식을 읽지 못했다. 스냅샷을 보는 중.");
        const at = ev.result?.cache?.storedAt;
        setStatus("ok", (DATA_DATE || "") + " 기준 · " +
          (at ? new Date(at).toLocaleTimeString("ko-KR", {hour:"2-digit",minute:"2-digit"}) + " 캐시"
              : "방금 갱신"));
        return;
      }
      const c = ev.error?.code;
      if (LIVE_MSG[c]) return setStatus("warn", LIVE_MSG[c]);   // 인증/연결 — 재시도 무의미
      if (ev.error?.retryable && !retried) {                    // 일시 오류만 1회
        retried = true;
        setStatus("wait", "연결이 불안정하다. 다시 시도 중…");
        setTimeout(() => mcp.invalidate("Supabase", "execute_sql").catch(() => {}),
                   1200 + Math.random() * 800);
        return;
      }
      setStatus("warn", "최신 데이터를 못 가져왔다. 발행 시점 스냅샷을 보는 중.");
    },
    { refetchInterval: 300000 });
}

(async () => {
  setStatus("wait", "최신 데이터 확인 중…");
  const mcp = window.claude ? await claude.use("mcp") : null;
  if (mcp) return connectArtifact(mcp);
  try {
    if (await connectVercel()) return;
  } catch { /* /api 가 없는 환경 — 스냅샷 유지 */ }
  setStatus("", "");
})();

  `라운드 편차는 14.6%p다. 한두 종목을 고르는 데 쓰기엔 잡음에 묻힌다. 투자 판단의 근거로 쓸 수 없다. ` +
  `관심 종목(★)과 알림 확인 여부는 이 브라우저에만 저장되고 서버로 가지 않는다 — 폰과 PC 가 따로 논다.`;

renderScore();
renderAlert();
render();
</script>
