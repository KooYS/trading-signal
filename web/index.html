<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<style>:root{color-scheme:light dark}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>구영서의 AI 매매 신호기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --sunk:#F0F2F5; --line:#E3E7EC; --line-soft:#EDF0F4;
  --ink:#14171C; --ink-2:#3D444F; --muted:#697586;
  --buy:#D42D2D; --buy-bg:#FDEDED; --sell:#1263C4; --sell-bg:#EAF2FC;
  --news:#966C18; --news-bg:#FBF3E2; --warn:#B4341C; --warn-bg:#FCEEEB;
  --bar:#3D444F;
  --shadow:0 1px 2px rgba(20,23,28,.05), 0 6px 16px -10px rgba(20,23,28,.18);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0F1216; --surface:#171B21; --sunk:#12161B; --line:#262C35; --line-soft:#1F252D;
  --ink:#E6E9ED; --ink-2:#B7BEC9; --muted:#838C9A;
  --buy:#FF7070; --buy-bg:#2A1618; --sell:#5FA6F2; --sell-bg:#111F30;
  --news:#D6AC63; --news-bg:#241D10; --warn:#F08163; --warn-bg:#2B1712;
  --bar:#8A93A0;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 20px -12px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --bg:#0F1216; --surface:#171B21; --sunk:#12161B; --line:#262C35; --line-soft:#1F252D;
  --ink:#E6E9ED; --ink-2:#B7BEC9; --muted:#838C9A;
  --buy:#FF7070; --buy-bg:#2A1618; --sell:#5FA6F2; --sell-bg:#111F30;
  --news:#D6AC63; --news-bg:#241D10; --warn:#F08163; --warn-bg:#2B1712;
  --bar:#8A93A0;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 20px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  line-height:1.55;-webkit-font-smoothing:antialiased}
/* 한글과 한 줄에 놓이는 숫자는 Mono 를 쓰지 않는다. Plex Mono 숫자는 대문자 높이만 차지하고
   한글은 em 박스를 채워서, 같은 베이스라인에 두면 숫자가 떠 보인다. 코드·시각·표·차트처럼
   숫자만 있는 자리에서만 Mono 다. */
body{font-variant-numeric:tabular-nums}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.wrap{max-width:1340px;margin:0 auto;padding:0 20px 56px}

/* ── 헤더: 제목 · 갱신 상태 · 사전. 한 줄 ── */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1340px;margin:0 auto;padding:12px 20px 0;display:flex;align-items:center;gap:10px}
h1{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.live{margin-left:auto;font-size:11.5px;padding:2px 8px;border-radius:2px;color:var(--muted);white-space:nowrap}
.live:empty{display:none}
.live.wait{background:var(--sunk)}
.live.ok{color:var(--ink-2);background:var(--sunk)}
.live.warn{color:var(--warn);background:var(--warn-bg)}
.ib{font:inherit;font-size:12px;font-weight:600;line-height:1;width:26px;height:26px;border-radius:50%;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;flex:none;padding:0}
.ib:hover{color:var(--ink);border-color:var(--muted)}
.ib:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
/* 오늘의 숫자 넷. 매일 안 바뀌는 검증 수치는 사전으로 보냈다 */
.strip{max-width:1340px;margin:0 auto;padding:8px 20px 11px;display:flex;gap:18px;flex-wrap:wrap}
.strip dl{margin:0;display:flex;align-items:baseline;gap:5px}
.strip dt{font-size:11px;color:var(--muted)}
.strip dd{margin:0;font-size:14px;font-weight:500;letter-spacing:-.01em}
.strip dd.ok{color:var(--buy)}

/* ── 필터바: 검색 + 탭 ── */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding:8px 0;margin-bottom:12px}
.bar-in{max-width:1340px;margin:0 auto;padding:0 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qbox{font:inherit;font-size:13px;padding:6px 10px;border-radius:3px;width:190px;
  background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.qbox::placeholder{color:var(--muted)}
.qbox:focus{outline:none;border-color:var(--muted)}
.qbox:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{font:inherit;font-size:12.5px;padding:6px 12px;border-radius:3px;cursor:pointer;
  background:var(--surface);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.chip:hover{border-color:var(--muted)}
.chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.55;font-size:11.5px;margin-left:1px}
.chip[aria-pressed="true"] .n{opacity:.75}
.chip.fav[aria-pressed="true"]{background:var(--news);color:#fff;border-color:var(--news)}
.caption{margin:0 0 10px;font-size:11.5px;color:var(--muted)}
.caption:empty{display:none}

/* ── 행: 결정에 필요한 것만. 나머지는 탭하면 상세 ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:10px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:5px;box-shadow:var(--shadow);
  padding:10px 12px 11px;display:grid;gap:6px;cursor:pointer;min-width:0;text-align:left;font:inherit;color:inherit}
.row:hover{border-color:var(--muted)}
.row:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.r1{display:flex;align-items:center;gap:7px;min-width:0}
.rank{font-size:11px;color:var(--muted);font-weight:500;min-width:18px}
.nm{font-size:15px;font-weight:500;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cd{font-size:11px;color:var(--muted)}
.mkt{font-size:10px;font-weight:600;padding:1px 5px;border-radius:2px;flex:none;letter-spacing:.02em}
.mkt.kp{color:var(--sell);background:var(--sell-bg)}
.mkt.kq{color:var(--news);background:var(--news-bg)}
.tm{margin-left:auto;font-size:11.5px;color:var(--muted);flex:none}
.r2{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.now{font-size:20px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
.sig{font-size:12px;color:var(--muted)}
.sig b{font-weight:500;color:var(--ink-2)}
.gap{font-size:12px;font-weight:500;color:var(--muted)}
.gap.up{color:var(--buy)} .gap.down{color:var(--sell)}
.r3{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
/* 과열도 알약. 빨강=좋다 / 파랑=나쁘다 — 실현수익률(+빨강 −파랑)과 같은 방향 */
.heat{font-size:11px;font-weight:600;padding:2px 7px;border-radius:2px;background:var(--sunk);color:var(--ink-2)}
.heat.good{color:var(--buy);background:var(--buy-bg)}
.heat.bad{color:var(--sell);background:var(--sell-bg)}
.heat.na{color:var(--muted);background:transparent;border:1px dashed var(--line);font-weight:400}
/* 용어. 점선 밑줄 = 누르면 사전의 그 항목으로 간다 */
.term{font:inherit;background:none;border:0;padding:0;color:inherit;cursor:help;
  text-decoration:underline dotted;text-decoration-color:var(--line);text-underline-offset:3px}
.term:hover{text-decoration-color:var(--muted)}
.term:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tag{font-size:10.5px;font-weight:500;padding:2px 7px;border-radius:2px;letter-spacing:.01em}
.tag.ok{color:var(--buy);background:var(--buy-bg);border:1px solid var(--buy-bg);font-weight:600}
.tag.bad{color:var(--sell);background:var(--sell-bg);border:1px solid var(--sell-bg);font-weight:600}
.tag.na{color:var(--muted);background:transparent;border:1px dashed var(--line)}
/* 검증에서 무효로 나온 것들. 검증된 배지(ok/bad)와 섞이지 않게 눌러둔다 */
.tag.info{color:var(--muted);background:transparent;border:1px solid var(--line-soft);font-weight:400}
button.tag.term{text-decoration:none}
/* 지지·저항 한 줄. 예측이 아니라 "여기 매물이 두껍다"는 관측 */
.r4{display:flex;gap:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.r4 b{font-weight:500}
.r4 .sup{color:var(--buy)} .r4 .res{color:var(--sell)}
.up{color:var(--buy)} .down{color:var(--sell)}

/* ── 상세 ── */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;
  display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:5px;
  width:min(1080px,100%);box-shadow:0 12px 40px -12px rgba(0,0,0,.5)}
.modal-head{display:flex;align-items:center;gap:9px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-t{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.modal-t .nm{font-size:17px;font-weight:600}
.modal-x{font:inherit;font-size:15px;line-height:1;background:none;border:0;color:var(--muted);
  cursor:pointer;padding:6px 8px;border-radius:2px}
.modal-x:hover{color:var(--ink);background:var(--sunk)}
.modal-x:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.modal-grid{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:20px;padding:16px 18px 20px}
.mcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.mprice{display:flex;flex-direction:column;gap:2px}
.mprice .now{font-size:24px}
.msec-h{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  font-weight:500;margin-bottom:5px}
.modal-news{max-height:340px;overflow-y:auto}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.band{display:grid;gap:2px}
.band-lg{display:flex;gap:10px;margin:1px 0 3px;font-size:11px;color:var(--muted)}
.lgi{display:flex;align-items:center;gap:3px}
.sw{width:8px;height:8px;border-radius:1px;display:inline-block}
.sw.sup{background:var(--buy)} .sw.res{background:var(--sell)} .sw.cur{background:var(--muted)}
.band-h{display:flex;align-items:center;gap:4px;font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:2px}
.brow{display:grid;grid-template-columns:64px 1fr 40px;align-items:center;gap:6px;font-size:12px;line-height:1.35}
.brow.here{font-weight:600}
.brow.here .blabel{color:var(--ink)}
.blabel{color:var(--muted);text-align:right}
.btrack{height:12px;background:var(--sunk);border-radius:1px;overflow:hidden}
.bfill{height:100%;border-radius:1px;min-width:1px}
.bfill.sup{background:var(--buy)}     /* 현재가 아래 = 지지 = 빨강(좋다) */
.bfill.res{background:var(--sell)}    /* 현재가 위 = 물린 물량 = 파랑 */
.bfill.cur{background:var(--muted)}   /* 현재가가 든 칸 = 절반이 아래라 중립 */
.brow.here .btrack{outline:1px solid var(--ink);outline-offset:1px}
.bpct{color:var(--muted);text-align:right}
.band-note{margin-top:4px;font-size:11px;color:var(--muted)}
.band-net{margin-left:auto;font-size:11px;letter-spacing:0;text-transform:none;font-weight:500}
.band-net.up{color:var(--buy)} .band-net.down{color:var(--sell)}
/* 매집: 왼쪽으로 자라는 판 것 | 오른쪽으로 자라는 산 것 */
.band.two .brow{grid-template-columns:64px 1fr 1fr;gap:0 4px}
.band.two .blabel{padding-right:4px}
.btrack.sell{display:flex;justify-content:flex-end;border-right:1px solid var(--line)}
.bfill.sell{background:var(--sell)}
.bfill.buy{background:var(--buy)}
.band-lg.two{display:grid;grid-template-columns:64px 1fr 1fr;gap:0 4px}
.band-lg.two .lg-sell{text-align:right;padding-right:6px;color:var(--sell);grid-column:2}
.band-lg.two .lg-buy{color:var(--buy);grid-column:3}
.band-lg.two .lg-c{text-align:center;color:var(--muted)}
.band.hold .brow{grid-template-columns:64px 1fr 34px 1fr 34px;gap:0 4px}
.band.hold .band-lg{grid-template-columns:64px 1fr 34px 1fr 34px}
.band.hold .lg-c:first-of-type{grid-column:2/4} .band.hold .lg-c:last-of-type{grid-column:4/6}
.bfill.hold{background:var(--news)}
.bfill.none{display:none}
.brow.edge .blabel{color:var(--ink-2);font-weight:500}
.band.hold .band-note{margin:0 0 6px}


.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 9px;font-size:12px}
.facts dt{color:var(--muted);font-weight:300}
.facts dd{margin:0;text-align:right;font-weight:500}
.item{padding:7px 0;border-top:1px solid var(--line-soft)}
.item:first-child{border-top:0}
.item.post{opacity:.5}
.item-t{font-size:12.5px;line-height:1.45;color:var(--ink-2);text-decoration:none;display:block}
a.item-t:hover{color:var(--ink);text-decoration:underline}
a.item-t:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.item-m{margin-top:3px;font-size:11px;color:var(--muted);display:flex;gap:7px}
.empty{padding:14px;font-size:12.5px;color:var(--muted);font-weight:300}

/* ── 사전: 물음표 1,000개 대신 한 페이지 ── */
dialog.dict{border:0;padding:0;margin:auto;background:var(--surface);color:var(--ink);
  width:min(680px,calc(100% - 32px));max-height:88vh;border-radius:6px;overflow-y:auto;
  box-shadow:0 12px 40px -12px rgba(0,0,0,.5)}
dialog.dict::backdrop{background:rgba(0,0,0,.55)}
.dict-head{position:sticky;top:0;z-index:1;background:var(--surface);display:flex;align-items:center;gap:9px;
  padding:14px 18px;border-bottom:1px solid var(--line)}
.dict-head h2{margin:0;font-size:16px;font-weight:600;flex:1}
.dict-body{padding:4px 18px 26px}
.dict-body h3{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:22px 0 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{background:var(--sunk);border:1px solid var(--line-soft);border-radius:3px;padding:10px 12px;margin:0}
.metric.flag{border-color:var(--news);background:var(--news-bg)}
.metric dt{margin:0 0 4px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}
.metric dd{margin:0;font-size:20px;font-weight:500;letter-spacing:-.02em}
.metric .note{display:block;margin-top:2px;font-size:11.5px;color:var(--muted);font-weight:300;letter-spacing:0}
.metric.flag dd{color:var(--news)}
.gl{margin:0}
.gl dt{font-size:13.5px;font-weight:600;margin-top:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  scroll-margin-top:64px;padding:2px 4px;margin-left:-4px;border-radius:3px;transition:background .6s}
.gl dt.hit{background:var(--news-bg);transition:none}
.gl dd{margin:4px 0 0;font-size:12.5px;line-height:1.65;color:var(--ink-2);font-weight:300;white-space:pre-wrap}
.verdict{display:inline-block;font-size:11px;font-weight:500;padding:1px 6px;border-radius:2px}
.verdict.ok{color:var(--buy);background:var(--buy-bg)}
.verdict.na{color:var(--news);background:var(--news-bg)}
.verdict.no{color:var(--muted);background:var(--sunk)}
.fine{font-size:12px;line-height:1.7;color:var(--muted);font-weight:300;margin:0}

/* ── 표 (진행중·매도·청산) ── */
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface);
  border:1px solid var(--line);border-radius:4px;overflow:hidden}
th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  font-weight:500;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--sunk)}
td{padding:7px 12px;border-bottom:1px solid var(--line-soft)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.age{color:var(--muted);font-size:12px}
.scroller{overflow-x:auto}
.scroller > .empty{background:var(--surface);border:1px solid var(--line);border-radius:4px}

/* 관심 종목 별. 행·표 어디서든 같은 모양 */
.star{font:inherit;font-size:15px;line-height:1;padding:1px 3px;border:0;background:none;
  cursor:pointer;color:var(--muted);opacity:.4;border-radius:2px}
.star:hover{opacity:.85}
.star.on{color:var(--news);opacity:1}
.star:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
th.s,td.s{width:24px;padding-left:10px;padding-right:0}
/* 종목 칸에 물려둔 코드·시장. 넓은 화면에서는 각자 칸이 있으므로 숨는다 */
.nm-code,.nm-mkt{display:none}
.nm-code{font-size:11.5px;color:var(--muted);font-weight:400}

/* 관심 종목이 팔렸다는 알림. 확인을 누를 때까지 남는다 */
.alert{margin:0 0 12px;padding:11px 13px;border:1px solid var(--news);background:var(--news-bg);
  border-radius:3px;font-size:12.5px;color:var(--ink-2);display:flex;gap:10px;align-items:flex-start}
.alert b{font-weight:600;color:var(--ink)}
.alert ul{margin:5px 0 0;padding-left:16px;line-height:1.75}
.alert .x{margin-left:auto;flex:none;font:inherit;font-size:16px;line-height:1;padding:0 4px;
  border:0;background:none;color:var(--muted);cursor:pointer}
.alert .x:hover{color:var(--ink)}

footer{margin-top:28px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;
  color:var(--muted);font-weight:300;line-height:1.7}

/* ── 좁은 화면 ──────────────────────────────────────────────
   표가 10칸을 넘어서 가로 스크롤로는 못 읽는다. 한 줄을 카드로 접고
   칸 이름을 각 값 옆에 붙인다(td::before + data-label).          */
@media (max-width:680px){
  .wrap{padding:0 12px 48px}
  .top-in{padding:10px 12px 0}
  h1{font-size:15px}
  .strip{padding:7px 12px 10px;gap:12px}
  .bar-in{padding:0 12px;gap:6px}
  /* iOS 는 input 글자가 16px 미만이면 포커스 때 화면을 확대한다 */
  .qbox{flex:1 1 100%;width:auto;font-size:16px;padding:8px 11px}
  .chips{flex:0 0 100%;flex-wrap:nowrap;overflow-x:auto;gap:6px;scrollbar-width:none;padding-bottom:1px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none}
  .grid{grid-template-columns:1fr;gap:8px}
  .row{padding:10px 12px}
  .star{font-size:17px;padding:5px 7px}   /* 손가락으로 누를 크기 */
  .r1 .star{margin:-5px -4px -5px -6px}

  /* 상세 → 바텀시트 */
  .modal-back{align-items:flex-end;padding:0;overflow:hidden}
  .modal{width:100%;max-height:92vh;overflow-y:auto;border-radius:12px 12px 0 0;border-bottom:0}
  .modal-head{position:sticky;top:0;z-index:1;background:var(--surface)}

/* 용어. 점선 밑줄, 누르면 사전의 그 항목으로 간다 */
function term(label, key, cls) {
  const b = el("button", "term" + (cls ? " " + cls : ""), label);
  b.type = "button"; b.dataset.k = key;
  b.setAttribute("aria-label", label + " — 사전에서 보기");
  return b;
}
document.addEventListener("click", e => {
  const t = e.target.closest(".term");
  if (t) openDict(t.dataset.k);
});
function openDict(key) {
  const d = document.getElementById("dict");
  if (!d.open) d.showModal();
  const t = key && document.getElementById("g-" + key);
  if (!t) { d.scrollTop = 0; return; }
  t.scrollIntoView({ block: "start" });
  t.classList.add("hit");
  setTimeout(() => t.classList.remove("hit"), 1500);
}
document.getElementById("dict-btn").addEventListener("click", () => openDict());
document.getElementById("dict-x").addEventListener("click", () => document.getElementById("dict").close());
document.getElementById("dict").addEventListener("click", e => {
  if (e.target === e.currentTarget) e.currentTarget.close();   // 배경 탭 = 닫기
});

/* ── 관심 종목 ───────────────────────────────────────────────
   이 브라우저의 localStorage 에만 있다. 서버에 사용자 개념이 없어서
   폰과 PC 가 따로 논다. 공유하려면 테이블이 하나 더 필요하다.      */
const FAV_KEY = "fav.codes", SEEN_KEY = "fav.seen";
const store = {
  get(k, dflt) { try { return JSON.parse(localStorage.getItem(k)) ?? dflt; } catch { return dflt; } },
  set(k, v)    { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* 시크릿 창 */ } },
};
const FAV = new Set(store.get(FAV_KEY, []));
let favOnly = false;
let query = "";      // 종목명·코드 검색어
const key = c => c.code + ":" + (c.sd || "");
const pick = rows => {
  let out = favOnly ? rows.filter(r => FAV.has(r.code)) : rows;
  if (query) out = out.filter(r =>
    (r.name || "").toLowerCase().includes(query) || (r.code || "").includes(query));
  return out;
};

function toggleFav(code) {
  FAV.has(code) ? FAV.delete(code) : FAV.add(code);
  store.set(FAV_KEY, [...FAV]);
  syncCounts(); renderAlert(); render();
}
function star(code) {
  const on = FAV.has(code);
  const b = el("button", "star" + (on ? " on" : ""), on ? "★" : "☆");
  b.type = "button";
  b.title = on ? "관심 해제" : "관심 등록";
  b.setAttribute("aria-pressed", String(on));
  b.addEventListener("click", () => toggleFav(code));
  return b;
}

  const strip = document.getElementById("strip");

  const ir = BUYS.filter(c => c.ir).length;
  for (const [k, v, cls] of [
    ["오늘 매수", BUYS.length],

    dl.append(el("dt", null, k));

/* 사전. 물음표 1,000개를 한 페이지로. 검증된 것 → 참고용 → 무효 순서라
   위에서부터 읽으면 뭘 믿어도 되는지가 먼저 나온다. */
function renderDict() {
  const b = document.getElementById("dict-body");
  b.replaceChildren();
  const h = t => b.append(el("h3", null, t));

  h("이 신호기");
  const st = el("div", "stats");
  for (const [k, v, note, flag] of [
    ["신호 승률", M.win + "%", M.rounds.toLocaleString() + "라운드"],
    ["라운드당 기대값", pct(M.exp), "이길때 " + pct(M.win_avg) + " / 질때 " + pct(M.loss_avg)],
    ["시장 대비 초과", "+0.71%p", "12년 6,369라운드. 신호의 실제 크기", true],
  ]) {
    const m = el("dl", "metric" + (flag ? " flag" : ""));
    m.append(el("dt", null, k));
    const dd = el("dd", null, v);
    dd.append(el("span", "note", note));
    m.append(dd);
    st.append(m);
  }
  b.append(st);

  h("탭");
  const tabs = el("dl", "gl");
  for (const [k, label] of TABS) {
    tabs.append(el("dt", null, label));
    tabs.append(el("dd", null, HINT[k]));
  }
  b.append(tabs);

  for (const [title, kind] of [["검증됨", "ok"], ["참고용", "na"], ["무효", "no"]]) {
    h(title);
    const dl = el("dl", "gl");
    for (const [k, [t, desc, v]] of Object.entries(GLOSS)) {
      if (!v || v[1] !== kind) continue;
      const dt = el("dt", null, t);
      dt.id = "g-" + k;
      dt.append(el("span", "verdict " + kind, v[0]));
      dl.append(dt);
      dl.append(el("dd", null, desc));
    }
    b.append(dl);
  }

  h("출처와 한계");
  b.append(el("p", "fine", DISCLAIMER()));
}

  const r1 = el("div", "r1");
  r1.append(el("span", "rank mono", "#" + rank));
  r1.append(star(c.code));
  r1.append(el("span", "nm", c.name));
  r1.append(el("span", "cd mono", c.code));
  if (c.mkt) r1.append(el("span", "mkt " + (c.mkt === "코스피" ? "kp" : "kq"), c.mkt));
  r1.append(el("span", "tm mono", c.time));
  w.append(r1);

  const r2 = el("div", "r2");
  r2.append(el("span", "now", c.now ? c.now.toLocaleString() + "원" : "—"));
  const sig = el("span", "sig");
  sig.append(document.createTextNode("신호가 "));
  sig.append(el("b", null, c.price ? c.price.toLocaleString() : "—"));
  r2.append(sig);
  if (c.gap != null) {
    const g = Number(c.gap);
    r2.append(el("span", "gap " + (g > 0 ? "up" : g < 0 ? "down" : ""), pct(g)));
  }
  w.append(r2);

  /* 색만으로는 방향을 못 읽는다. 판정을 말로도 적는다 */
  const r3 = el("div", "r3");
  const h = c.heat;
  const kind = h == null ? "na" : h >= 70 ? "bad" : h <= 30 ? "good" : "";
  const word = h == null ? "지표 없음" : h >= 70 ? "과열" : h <= 30 ? "양호" : "보통";
  r3.append(el("span", "heat " + kind, h == null ? word : `과열도 ${h} ${word}`));
  for (const [t, k] of badges(c, true)) r3.append(el("span", "tag " + k, t));
  w.append(r3);

  const sr = srLine(c);
  if (sr) w.append(sr);

  const open = () => openDetail(c);
  w.addEventListener("click", e => { if (!e.target.closest("button, a")) open(); });
  w.addEventListener("keydown", e => {
    if (e.target === w && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); open(); }
  });
  return w;
}

/* 격자 칸 k 의 경계. 서버는 k 만 보내고 경계는 현재가(px)로 되살린다 — 칸 폭은 항상 2.5% 다 */
const STEP = 1.025;
const kLo = (px, k) => px * Math.pow(STEP, k - 0.5);
const kHi = (px, k) => px * Math.pow(STEP, k + 0.5);

/* 지지·저항. 격자는 전일 종가 기준이라 오늘 크게 움직인 종목은 '저항' 이 현재가 아래로
   내려와 있을 수 있다(제넥신 +15% 에 저항 2,850). 현재가로 다시 가른다. */
function levels(c) {
  const all = [...(c.sup || []), ...(c.res || [])];
  if (c.now == null) return { sup: c.sup || [], res: c.res || [] };
  return {
    sup: all.filter(z => z.hi <= c.now).sort((a, b) => b.hi - a.hi),
    res: all.filter(z => z.lo >= c.now).sort((a, b) => a.lo - b.lo),
  };
}
/* 한 줄. 예측이 아니라 "여기 매물이 두껍다"는 관측이다. 없는 쪽은 이유를 적는다 —
   '1년 최저권' 은 지지가 없다는 뜻이라 오히려 경고다. */
function srLine(c) {
  if (c.px == null) return null;
  const { sup, res } = levels(c);
  const w = el("div", "r4");
  const mk = (label, arr, cls, none) => {
    const sp = el("span");
    sp.append(document.createTextNode(label + " "));
    sp.append(arr.length ? el("b", cls, won(arr[0].lo) + "~" + won(arr[0].hi)) : el("b", null, none));
    return sp;
  };
  w.append(mk("지지", sup, "sup", "없음(−26% 내)"));
  w.append(mk("저항", res, "res", "없음(+34% 내)"));
  return w;
}

/* 총거래량 매물대 — 지지·저항의 근거. 상세에서만 그린다. */
function vpChart(c) {
  if (!c.vp || !c.vp.length || c.px == null) return el("div");
  const wrap = el("div", "band big");
  const h = el("div", "band-h");
  h.append(term("총거래량 매물대" + (c.vpDays ? ` ${c.vpDays}일` : ""), "vp"));
  wrap.append(h);
  const share = new Map(c.vp);
  const max = Math.max(...c.vp.map(z => z[1]));
  for (let k = 11; k >= -12; k--) {
    const lo = kLo(c.px, k), hi = kHi(c.px, k), v = share.get(k) || 0;
    const here = c.now != null && c.now >= lo && c.now < hi;
    const below = c.now != null && !here && hi <= c.now;
    const row = el("div", "brow" + (here ? " here" : ""));
    row.append(el("span", "blabel mono", won(Math.round(lo))));
    const track = el("div", "btrack");
    const fill = el("div", "bfill " + (here ? "cur" : below ? "sup" : "res"));
    fill.style.width = (max ? (v / max) * 100 : 0) + "%";
    track.append(fill);
    row.append(track);
    row.append(el("span", "bpct mono", v ? v.toFixed(1) + "%" : ""));
    wrap.append(row);
  }
  /* 창은 현재가 −26%~+34% 다. 급락 종목은 매물이 대부분 창 위에 있다 — 그걸 숨기면 안 된다 */
  if (c.outAbove != null || c.outBelow != null)
    wrap.append(el("div", "band-note",
      `창 밖 매물 · 위(+34%↑) ${c.outAbove ?? 0}% · 아래(−26%↓) ${c.outBelow ?? 0}%`));
  return wrap;
}

function bandChart(c) {
  const t = c.bandTot || {};
  const nf = (t.bf || 0) - (t.sf || 0), ni = (t.bi || 0) - (t.si || 0), net = nf + ni;
  if (!c.band || !c.band.length || c.px == null) return el("div");
  const wrap = el("div", "band big two");
  const h = el("div", "band-h");
  h.append(term("외국인·기관" + (c.bandDays ? ` ${c.bandDays}일` : ""), "band"));
  /* 1년 순합계를 머리에 박는다. 산 자리만 그리면 '매집' 으로 읽히는데
     대부분 산 만큼 팔았고, 순매도인 종목이 절반이다 */
  h.append(el("span", "band-net " + (net > 0 ? "up" : net < 0 ? "down" : ""),
    `1년 순매${net >= 0 ? "수" : "도"} ${qty(net).replace(/^[-+]/, "")} (외인 ${qty(nf)} · 기관 ${qty(ni)})`));
  wrap.append(h);
  const lg = el("div", "band-lg two");
  lg.append(el("span", "lg-sell", "◀ 판 것"));
  lg.append(el("span", "lg-buy", "산 것 ▶"));
  wrap.append(lg);
  const rows = new Map(c.band.map(([k, bf, bi, sf, si]) => [k, [bf + bi, sf + si]]));
  const max = Math.max(...[...rows.values()].flat());
  for (let k = 11; k >= -12; k--) {
    const lo = kLo(c.px, k), hi = kHi(c.px, k);
    const [buy = 0, sell = 0] = rows.get(k) || [];
    const here = c.now != null && c.now >= lo && c.now < hi;
    const row = el("div", "brow" + (here ? " here" : ""));
    row.append(el("span", "blabel mono", won(Math.round(lo))));
    const st = el("div", "btrack sell");
    const sf = el("div", "bfill sell"); sf.style.width = (max ? sell / max * 100 : 0) + "%";
    sf.title = "순매도 " + qty(-sell);
    st.append(sf); row.append(st);
    const bt = el("div", "btrack buy");
    const bf = el("div", "bfill buy"); bf.style.width = (max ? buy / max * 100 : 0) + "%";
    bf.title = "순매수 " + qty(buy);
    bt.append(bf); row.append(bt);
    wrap.append(row);
  }
  return wrap;
}

/* 남은 물량의 가격대 구성. "외국인은 어디에 물려 있고 어디에 들고 있나".
   1년 창 안에서 산 로트를 가격대에 쌓고, 판 날엔 들고 있던 로트 전체를 같은 비율로 깎은
   결과다(hold_band). 칸마다 '남은 것 중 몇 %' 로 적는다 — 수량은 총합에만. */
function holdChart(c) {
  if (!c.hold || !c.hold.length || c.px == null) return el("div");
  const t = c.bandTot || {};
  const rows = new Map(c.hold.map(([k, f, i]) => [k, [f, i]]));
  const totF = c.hold.reduce((a, z) => a + z[1], 0), totI = c.hold.reduce((a, z) => a + z[2], 0);
  const wrap = el("div", "band big two hold");
  const h = el("div", "band-h");
  h.append(term("남은 물량 · 1년 내 매수분", "hold"));
  wrap.append(h);
  /* 머리: 얼마나 남았나. 산 것 대비 비율이 '이미 다 넘겼는지' 를 말해준다 */
  const sub = el("div", "band-note");
  const line = (who, tot, bought) => tot > 0
    ? `${who} ${qty(tot).replace(/^[-+]/, "")} 남음 (산 것의 ${Math.round(100 * tot / bought)}%)`
    : `${who} 1년 내 산 것 전량 매도`;
  sub.append(document.createTextNode(line("외인", totF, t.bf || 1) + " · " + line("기관", totI, t.bi || 1)));
  wrap.append(sub);
  const lg = el("div", "band-lg two");
  lg.append(el("span", "lg-c", "외인"));
  lg.append(el("span", "lg-c", "기관"));
  wrap.append(lg);
  const pct = (v, tot) => tot > 0 ? 100 * v / tot : 0;
  const maxPct = Math.max(...[...rows].map(([, [f, i]]) => Math.max(pct(f, totF), pct(i, totI))), 1);
  const cell = (v, tot) => {
    const p = pct(v, tot);
    const tr = el("div", "btrack");
    const f = el("div", "bfill " + (p ? "hold" : "none"));
    f.style.width = (p / maxPct * 100) + "%";
    tr.append(f);
    const n = el("span", "bpct mono", p >= 0.5 ? Math.round(p) + "%" : "");
    return [tr, n];
  };
  /* 창 위(+34%↑)에 남은 것이 '물린 물량' 이다. 맨 위에 따로 적는다 */
  const mk = (label, k, cls) => {
    const [f = 0, i = 0] = rows.get(k) || [];
    const row = el("div", "brow" + (cls ? " " + cls : ""));
    row.append(el("span", "blabel mono", label));
    for (const x of [...cell(f, totF), ...cell(i, totI)]) row.append(x);
    return row;
  };
  wrap.append(mk(won(Math.round(kHi(c.px, 11))) + "↑", 12, "edge"));
  for (let k = 11; k >= -12; k--) {
    const lo = kLo(c.px, k), hi = kHi(c.px, k);
    wrap.append(mk(won(Math.round(lo)), k, c.now != null && c.now >= lo && c.now < hi ? "here" : ""));
  }
  wrap.append(mk(won(Math.round(kLo(c.px, -12))) + "↓", -13, "edge"));
  return wrap;
}

/* ── 상세 ────────────────────────────────────────────────────
   카드는 훑고 비교하는 화면이라 가볍게 두고, 정독할 것은 여기로 모은다. */
function openDetail(c) {
  const back = el("div", "modal-back");
  const box = el("div", "modal");

  const head = el("div", "modal-head");
  const t = el("div", "modal-t");
  t.append(el("span", "nm", c.name));
  t.append(el("span", "cd mono", c.code));
  if (c.mkt) t.append(el("span", "mkt " + (c.mkt === "코스피" ? "kp" : "kq"), c.mkt));
  head.append(t);
  const x = el("button", "modal-x", "✕");
  x.setAttribute("aria-label", "닫기");
  head.append(x);
  box.append(head);

  const grid = el("div", "modal-grid");

  /* 왼쪽 — 가격과 판정 */
  const a = el("div", "mcol");
  const pr = el("div", "mprice");
  pr.append(el("span", "now", c.now ? c.now.toLocaleString() + "원" : "—"));
  if (c.gap != null) {
    const g = Number(c.gap);
    pr.append(el("span", "gap " + (g > 0 ? "up" : g < 0 ? "down" : ""),
      "신호가 " + (c.price ? c.price.toLocaleString() : "—") + " · " + pct(g)));
  }
  a.append(pr);
  const tg = el("div", "tags");
  for (const [txt, kind, key] of badges(c))
    tg.append(key ? term(txt, key, "tag " + kind) : el("span", "tag " + kind, txt));
  if (tg.childElementCount) a.append(tg);
  const sr = srLine(c);
  if (sr) a.append(sr);
  a.append(mSection("지표", [
    ["과열도", c.heat == null ? "—" : c.heat, "heat"],
    ["20일 밴드", c.hp && c.hp.pos != null ? c.hp.pos + "%" : "—", "pos"],
    ["20일선 이격", c.hp && c.hp.ma20 != null ? Number(c.hp.ma20).toFixed(2) + "%" : "—", "ma20"],
    ["매물대 대비", c.hp && c.hp.vwap != null ? Number(c.hp.vwap).toFixed(2) + "%" : "—", "vwap"],
    ["5일 수익률", c.ret5 == null ? "—" : pct(c.ret5)],
    ["20일 수익률", c.ret20 == null ? "—" : pct(c.ret20)],
    ["거래량 배수", c.vol == null ? "—" : Number(c.vol).toFixed(1) + "배", "vol"],
  ]));
  a.append(mSection("재무", [
    ["시총", eok(c.cap), "cap"],
    ["PBR", c.pbr == null ? "—" : Number(c.pbr).toFixed(1), "pbr"],
    ["ROE", c.roe == null ? "—" : Number(c.roe).toFixed(1) + "%", "roe"],
    ["52주 위치", c.p52 == null ? "—" : c.p52 + "%", "p52"],
    ["업종", c.ind || "—"],
  ]));
  a.append(mSection("수급", [
    ["외국인 보유", c.frate == null ? "—" : Number(c.frate).toFixed(1) + "%", "frate"],
    ["외국인 연속", c.fgn ? c.fgn + "일 " + qty(c.fgn5) : "—", "flow"],
    ["기관 연속", c.ins ? c.ins + "일 " + qty(c.ins5) : "—", "flow"],
    ["국면", c.regime === "inst_only" ? "기관만 매도 " + c.isell + "일"
           : c.regime === "both" ? "외국인·기관 동시 매도"
           : c.regime === "fgn_only" ? "외국인만 매도 " + c.fsell + "일" : "—", "regime"],
    ["기준일", c.fasof || "—"],
  ]));
  grid.append(a);

  /* 가운데 — 매집 분포 */
  const b2 = el("div", "mcol");
  b2.append(vpChart(c));
  if (c.band && c.band.length) { b2.append(bandChart(c)); b2.append(holdChart(c)); }
  else b2.append(el("p", "empty", "수급 이력이 없어 매집 분포를 못 그린다."));
  grid.append(b2);

  /* 오른쪽 — 공시·뉴스 */
  const c3 = el("div", "mcol");
  const dl = (c.disc || []);
  const dh = el("div", "msec-h");
  dh.append(term("공시 (신호 전 7일)", "disc"));
  c3.append(dh);
  if (!dl.length) c3.append(el("p", "empty", "해당 기간 공시 없음."));
  else for (const d of dl) {
    const row = el("div", "item");
    row.append(el("span", "item-t", d.t));
    row.append(el("div", "item-m").appendChild(el("span", "mono", d.d || "")).parentNode);
    c3.append(row);
  }
  const nh = el("div", "msec-h");
  nh.append(term(`뉴스 ${(c.news || []).length}건`, "news"));
  c3.append(nh);
  const nl = el("div", "modal-news");
  if (!(c.news || []).length) nl.append(el("p", "empty", "최근 7일 내 관련 기사 없음."));
  else for (const n of c.news) nl.append(newsItem(n, !n.pre));
  c3.append(nl);
  grid.append(c3);

  box.append(grid);
  back.append(box);
  document.body.append(back);

  const close = () => { back.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  x.addEventListener("click", close);
  back.addEventListener("click", e => { if (e.target === back) close(); });
  document.addEventListener("keydown", onKey);
  x.focus();
}

function mSection(title, rows) {
  const w = el("div");
  w.append(el("div", "msec-h", title));
  const dl = el("dl", "facts");
  for (const [k, v, key] of rows) {
    const dt = el("dt");
    dt.append(key ? term(k, key) : document.createTextNode(k));
    dl.append(dt);
    dl.append(el("dd", null, String(v)));
  }
  w.append(dl);
  return w;
}

function newsItem(n, after) {
  const d = el("div", "item" + (after ? " post" : ""));
  const a = el("a", "item-t", n.t);
  a.href = n.u; a.target = "_blank"; a.rel = "noopener noreferrer";
  d.append(a);
  const m = el("div", "item-m");
  m.append(el("span", "mono", n.at));
  if (n.s) m.append(el("span", null, n.s));
  d.append(m);
  return d;
}

/* 표 머리. [제목, 우측정렬] */
function tableHead(t, cols) {
  const hr = el("tr");
  hr.append(el("th", "s", ""));                       // 별 칸
  for (const [h, r] of cols) hr.append(el("th", r ? "r" : null, h));
  const thead = el("thead"); thead.append(hr); t.append(thead);
  return el("tbody");
}
const won = v => v ? Number(v).toLocaleString() : "—";
const starCell = code => { const n = el("td", "s"); n.append(star(code)); return n; };

/* 좁은 화면에서 표는 한 줄이 카드 하나로 접힌다. 그때 data-label 이 이름표가 된다 */
function td(label, cls, text) {
  const n = el("td", cls, text);
  if (label) n.dataset.label = label;
  return n;
}
/* 종목 칸. 접히면 카드 제목 줄이 되므로 코드·시장을 함께 물고 간다
   (넓은 화면에서는 그 둘이 각자 칸을 갖고, 여기 붙은 건 숨는다) */
function nameCell(o) {
  const n = el("td", "col-nm");
  n.append(el("span", null, o.name));
  n.append(el("span", "nm-code mono", o.code));
  if (o.mkt) n.append(el("span", "nm-mkt mkt " + (o.mkt === "코스피" ? "kp" : "kq"), o.mkt));
  return n;
}
/* 수익률 칸. 부호에 따라 색이 붙는다 */
function pctCell(label, v) {
  const n = v == null ? null : Number(v);
  return td(label, "r mono " + (n > 0 ? "up" : n < 0 ? "down" : ""), n == null ? "—" : pct(n));
}

function sellTable() {
  const t = el("table");
  const tb = tableHead(t, [["종목", 0], ["코드", 0], ["시장", 0], ["시각", 0],
                      ["매수일", 0], ["매수가", 1], ["매도가", 1], ["현재가", 1],
                      ["실현수익률", 1], ["보유", 1]]);
  for (const s of pick(SELLS)) {
    const tr = el("tr");
    tr.append(starCell(s.code));
    tr.append(nameCell(s));
    tr.append(td("코드", "mono col-code", s.code));
    tr.append(td("시장", "col-mkt", s.mkt || "—"));
    tr.append(td("매도 시각", "mono", s.time));
    tr.append(td("매수일", "mono age", s.bd || "—"));
    tr.append(td("매수가", "r mono", won(s.bp)));
    tr.append(td("매도가", "r mono", won(s.price)));
    tr.append(td("현재가", "r mono", won(s.now)));
    tr.append(pctCell("실현수익률", s.profit));
    tr.append(td("보유", "r age", s.held == null ? "—" : s.held + "일"));
    tb.append(tr);
  }
  t.append(tb);
  return t;
}

/* 청산 — 매도로 닫힌 라운드. 오늘 매도 탭은 하루면 사라지므로
   "결국 얼마 났나" 를 되짚는 창구는 여기다 */
function closedTable() {
  const t = el("table");
  const tb = tableHead(t, [["매도일", 0], ["종목", 0], ["코드", 0], ["시장", 0],
                      ["매수일", 0], ["매수가", 1], ["매도가", 1],
                      ["실현수익률", 1], ["보유", 1]]);
  for (const c of pick(CLOSED)) {
    const tr = el("tr");
    tr.append(starCell(c.code));
    tr.append(td("매도일", "mono", c.sd));
    tr.append(nameCell(c));
    tr.append(td("코드", "mono col-code", c.code));
    tr.append(td("시장", "col-mkt", c.mkt || "—"));

/* 신호의 일생을 탭 순서로 세웠다: 오늘 매수 → 진행중 → 오늘 매도 → 청산 */

  ["closed", "청산",      () => CLOSED.length ? pick(CLOSED).length
                              : (query || favOnly) ? "–" : D.closedCount || 0],
];
const HINT = {
  open:   "이전 날짜에 매수 신호가 났고 아직 매도 신호가 안 난 것. 오늘의 진입 후보가 아니라 경과 관찰 대상이다.",
  buy:    "오늘 새로 발생한 매수 신호. 과열도 낮은 순으로 세운다 — 그날 후보 중 이미 많이 오른 것을 사면 손해라는 게 728일 검정에서 나온 유일한 결과다.",
  sell:   "오늘 매도 신호가 난 것. 그 종목을 언제 얼마에 샀다고 신호했는지 함께 붙였다.",
  closed: "매도로 끝난 라운드. 최근 30일. 매수 신호가에 사서 매도 신호가에 팔았다고 가정한 실현수익률이고 수수료·세금·슬리피지는 빠져 있다.",
};
/* 탭이 비었을 때 빈 화면 대신 이유를 적는다 */

  sell:   "오늘은 매도 신호가 없다.",

/* 점수의 근거를 문장 대신 태그로. 카드를 보면 왜 위에 있는지 읽힌다 */
/* 배지는 두 종류다.
   ok/bad = 6,369 라운드에서 검증된 것. 그 외는 전부 info — 무효로 확인됐지만
   판단에 참고가 되니 남긴다. 색으로 구분해서 검증된 것처럼 보이지 않게 한다. */
/* [문구, 색, 용어키]. 색은 ok/bad 만 검증된 것이고 info 는 참고용이다 */
function badges(c, brief) {
  const out = [];
  if (c.ir) out.push(["IR 공시 " + String(c.ir).slice(5), "ok", "ir"]);
  /* 1년 거래량의 5% 미만이 현재가 아래. 경고로 붙였다가 검정해 보니 반대였다(§3) */
  if (c.belowShare != null && c.belowShare <= 5) out.push(["1년 최저권", "ok", "low52"]);
  /* brief = 행. 과열도는 알약이 따로 있고, 공시·연속 순매수·거래량은 무효라 상세로 */
  if (!brief) {
    if (c.heat != null && c.heat >= 70) out.push(["과열 상위 " + c.heat, "bad", "hot"]);
    if (c.heat != null && c.heat <= 30) out.push(["눌림 하위 " + c.heat, "ok", "cool"]);
    for (const d of (c.disc || []).slice(0, 2))
      out.push([String(d.t).replace(/^\[[^\]]*\]/, "").trim().slice(0, 18), "info", "disc"]);
    if (c.fgn >= 3) out.push(["외국인 " + c.fgn + "일 " + qty(c.fgn5), "info", "flow"]);
    if (c.ins >= 3) out.push(["기관 " + c.ins + "일 " + qty(c.ins5), "info", "flow"]);
    if (c.vol != null && c.vol >= 2) out.push(["거래량 " + Number(c.vol).toFixed(1) + "배", "info", "vol"]);
  }
  /* 수급 국면 — 검정에서 순서가 두 표본에 걸쳐 일치한 유일한 수급 지표. 아직 참고용 */
  if (c.regime === "inst_only") out.push(["기관만 매도 " + c.isell + "일", "info", "regime"]);
  if (c.regime === "both") out.push(["외국인·기관 동시 매도", "info", "regime"]);
  if (c.loss) out.push(["적자", "info", "loss"]);
  if (c.pbr != null && c.pbr < 1) out.push(["PBR " + Number(c.pbr).toFixed(1), "info", "pbr"]);
  if (c.gap != null && c.gap > 3) out.push(["진입 늦음 " + pct(c.gap), "info", "gap"]);
  if (!brief && c.heat == null) out.push(["지표 없음", "na"]);
  return out;
}

/* 청산 이력은 본 응답의 41%(71KB)라 빼놨다. 탭을 처음 열 때 한 번만 받는다. */
let closedState = "idle";        // idle | loading | done | fail
async function loadClosed() {
  if (closedState !== "idle") return;
  closedState = "loading";
  render();
  try {
    const k = new URLSearchParams(location.search).get("k");
    const r = await fetch("/api/data?part=closed" + (k ? "&k=" + encodeURIComponent(k) : ""));
    if (!r.ok) throw new Error(r.status);
    CLOSED = await r.json();
    closedState = "done";
  } catch {
    closedState = "fail";
  }
  const b = document.querySelector('.chip[data-f="closed"] .n');
  if (b) b.textContent = String(TABS.find(t => t[0] === "closed")[2]());
  render();
}

let filter = "buy";
function render() {
  const grid = document.getElementById("grid"), table = document.getElementById("table");

  const n = TABS.find(t => t[0] === filter)[2]();
  if (!n) {                                   // 빈 격자 대신 이유를 적는다
    grid.hidden = true; table.hidden = false;
    // 아직 못 받은 것과 진짜 0건은 다르다. 섞으면 "오늘 신호 없음"으로 오해한다
    table.replaceChildren(el("p", "empty",
      filter === "closed" && closedState === "loading" ? "청산 이력을 불러오는 중…"
      : filter === "closed" && closedState === "fail" ? "청산 이력을 못 가져왔다."
      : !LOADED ? "불러오는 중…"
      : query ? `"${query}" 에 해당하는 종목이 이 탭에 없다. 다른 탭에는 있을 수 있다.`
      : favOnly ? "관심 종목 중에는 해당하는 게 없다. ★ 관심 을 끄면 전체가 보인다."
      : EMPTY[filter]));
    cnt.textContent = "";
    return;
  }

  if (filter === "buy") {
    grid.hidden = false; table.hidden = true;
    grid.replaceChildren(...pick(BUYS).map((c, i) => buyRow(c, i + 1)));
    cnt.textContent = `${n}건 · 과열도 낮은 순` + (FLOW_ASOF ? ` · 수급 ${FLOW_ASOF} 기준` : "");
    return;
  }
  grid.hidden = true; table.hidden = false;
  table.replaceChildren(filter === "sell" ? sellTable() : filter === "open" ? openTable() : closedTable());
  cnt.textContent = filter === "sell" ? `${n}건` : filter === "open" ? `${n}종목 진행중` : `${n}라운드 · 최근 30일`;
}

/* ── 관심 종목 매도 알림 ─────────────────────────────────────
   오늘 매도 탭은 하루면 사라진다. 놓치지 않게, 확인을 누를 때까지
   남긴다. 확인 표시도 이 브라우저에만 쌓인다.                  */
function renderAlert() {
  const box = document.getElementById("alert");
  const seen = new Set(store.get(SEEN_KEY, []));
  const fresh = CLOSED.filter(c => FAV.has(c.code) && !seen.has(key(c)));
  box.replaceChildren();
  if (!fresh.length) return;

  const d = el("div", "alert"), body = el("div");
  body.append(el("b", null, `관심 종목 ${fresh.length}건이 매도됐다`));
  const ul = el("ul");
  for (const c of fresh.slice(0, 8)) {
    const li = el("li");
    li.append(document.createTextNode(c.name + " "));
    const v = Number(c.profit);
    li.append(el("span", "mono " + (v > 0 ? "up" : v < 0 ? "down" : ""), pct(v)));
    li.append(el("span", "mono", ` ${won(c.bp)} → ${won(c.sp)}`));
    li.append(document.createTextNode(` · ${c.sd} · ${c.held}일 보유`));
    ul.append(li);
  }
  if (fresh.length > 8) ul.append(el("li", null, `외 ${fresh.length - 8}건`));
  body.append(ul);
  d.append(body);

  const x = el("button", "x", "×");
  x.type = "button"; x.title = "확인";
  x.addEventListener("click", () => {
    /* 30일 창을 벗어난 키는 같이 버린다 — 무한정 쌓이지 않게 */
    const live = new Set(CLOSED.map(key));
    store.set(SEEN_KEY, [...new Set([...seen, ...fresh.map(key)])].filter(k => live.has(k)));
    renderAlert();
  });
  d.append(x);
  box.append(d);
}

/* 보유중: 진입 이후 평가수익률 */

/* 종목이 100개를 넘어 손이 자주 가는 자리다. / 로 진입, Esc 로 비운다. */
document.addEventListener("keydown", e => {
  const q = document.getElementById("q");
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName || "");
  if (e.key === "/" && !typing) { e.preventDefault(); q.focus(); q.select(); return; }
  if (e.key === "Escape" && document.activeElement === q && q.value) {
    q.value = ""; q.dispatchEvent(new Event("input")); e.stopPropagation();
  }
});

document.getElementById("q").addEventListener("input", e => {
  query = e.target.value.trim().toLowerCase();
  for (const [key, , n] of TABS) {

});

/* ── 라이브 갱신 ─────────────────────────────────────────────
   아티팩트 CSP가 외부 fetch 를 막아서 Supabase 를 직접 못 부른다.
   대신 뷰어의 Supabase 커넥터를 통해 읽는다. 연결이 안 되면(다른 사람이
   열었거나 커넥터가 없거나) 발행 시점 스냅샷 그대로 보인다.            */
const PROJECT = "fvwwxhdufcqpcyysfdgg";
const QUERY = "select data from page_live";

function setStatus(kind, text) {
  const el0 = document.getElementById("live");
  el0.className = "live " + kind;
  el0.textContent = text;
}

/* execute_sql 은 안내문으로 감싼 텍스트를 준다. 그 안의 JSON 만 꺼낸다 */
function parseRows(payload) {
  if (payload && typeof payload === "object") return payload;
  if (typeof payload !== "string") return null;
  const m = payload.match(/<untrusted-data-[^>]*>\s*([\s\S]*?)\s*<\/untrusted-data-/);
  try { return JSON.parse(m ? m[1] : payload); } catch { return null; }
}

/* 라이브를 못 가져왔을 때만 스냅샷으로 떨어진다. 언제 것인지 밝힌다. */
function fallbackSnapshot(why) {
  if (LOADED) return;                       // 이미 최신이 떠 있으면 건드리지 않는다
  applyLive(SNAP, true);
  setStatus("warn", `${why} · ${SNAP.date || "발행 시점"} 스냅샷을 보는 중`);
}

function applyLive(d, isSnap) {
  if (!d || !Array.isArray(d.buys)) return false;
  if (!isSnap) LOADED = true;
  D = d; BUYS = d.buys; SELLS = d.sells || []; OPEN = d.open || []; CLOSED = d.closed || [];
  FLOW_ASOF = (BUYS.find(b => b.fasof) || {}).fasof || null;
  DATA_DATE = d.date || null;
  if (d.stat) M = Object.assign({}, M, d.stat, {
    buy_news: BUYS.filter(c => c.news.some(n => n.pre)).length,
    buy_loss: BUYS.filter(c => c.loss).length });
  syncCounts();
  renderAlert();
  renderStrip();
  render();
  return true;
}

const LIVE_MSG = {
  needs_reauth:        "Supabase 연결이 만료됐다. 커넥터를 다시 연결하면 최신 데이터가 뜬다.",
  server_not_connected:"Supabase 커넥터가 없다. 연결하면 매일 자동으로 갱신된다.",
  selection_required:  "Supabase 커넥터가 여러 개다. 하나를 고르면 갱신된다.",
  not_granted:         "데이터 접근이 허용되지 않았다.",
  blocked_by_policy:   "정책상 이 연결이 차단됐다.",
  approval_required:   "승인이 필요한 연결이다.",
};

/* 데이터 소스는 두 곳. 아티팩트에서는 뷰어의 Supabase 커넥터를 통하고(CSP가
   외부 fetch를 막는다), Vercel 에서는 서버리스 프록시를 부른다. 둘 다 없으면
   발행 시점 스냅샷 그대로 — 기능만 빠지고 화면은 산다. */
async function connectVercel() {
  const k = new URLSearchParams(location.search).get("k");
  const r = await fetch("/api/data" + (k ? "?k=" + encodeURIComponent(k) : ""));
  if (r.status === 401) { fallbackSnapshot("접근 거부"); return true; }
  if (!r.ok) { fallbackSnapshot("서버 오류 " + r.status); return true; }
  if (!applyLive(await r.json())) { fallbackSnapshot("형식 오류"); return true; }
  setStatus("ok", (DATA_DATE || "").slice(5) + " 기준 · 방금 갱신");
  return true;
}

function connectArtifact(mcp) {
  let retried = false;
  mcp.watchTool("Supabase", "execute_sql",
    { project_id: PROJECT, query: QUERY },
    (ev) => {
      if (ev.type === "data") {
        const rows = parseRows(ev.result?.payload);
        const d = Array.isArray(rows) ? rows[0]?.data : rows?.data;
        if (!applyLive(d)) return fallbackSnapshot("형식 오류");
        const at = ev.result?.cache?.storedAt;
        setStatus("ok", (DATA_DATE || "") + " 기준 · " +
          (at ? new Date(at).toLocaleTimeString("ko-KR", {hour:"2-digit",minute:"2-digit"}) + " 캐시"
              : "방금 갱신"));
        return;
      }
      const c = ev.error?.code;
      if (LIVE_MSG[c]) { fallbackSnapshot(LIVE_MSG[c]); return; }   // 인증/연결 — 재시도 무의미
      if (ev.error?.retryable && !retried) {                    // 일시 오류만 1회
        retried = true;
        setStatus("wait", "연결이 불안정하다. 다시 시도 중…");
        setTimeout(() => mcp.invalidate("Supabase", "execute_sql").catch(() => {}),
                   1200 + Math.random() * 800);
        return;
      }
      fallbackSnapshot("최신 데이터 실패");
    },
    { refetchInterval: 300000 });
}

(async () => {
  setStatus("wait", "최신 데이터 확인 중…");
  const mcp = window.claude ? await claude.use("mcp") : null;
  if (mcp) return connectArtifact(mcp);
  try {
    if (await connectVercel()) return;
  } catch { /* /api 가 없는 환경 (저장한 파일 등) */ }
  fallbackSnapshot("연결 없음");
})();

document.getElementById("foot").textContent =
  "출처: thinkpool 매매신호 · Google News RSS · 토스증권 · DART. 개인 모니터링 목적으로만 수집했고 재배포하지 않는다. "
  + "투자 판단의 근거로 쓸 수 없다 — 왜 그런지는 사전(?)의 '출처와 한계'에 적었다.";

renderDict();
renderAlert();
